<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMap - Opciones TI/contabilidad</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #3385bd;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .options-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #3385bd;
    }

    .waves {
      position: absolute;
      inset: auto 0 0 0;
      width: 100%;
      height: 58%;
    }

    .waves path {
      shape-rendering: geometricPrecision;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      padding: clamp(28px, 7vh, 34px) 28px 0;
      text-align: center;
    }

    .page-title {
      font-size: clamp(18px, 3.2vw, 19px);
      font-weight: 400;
      line-height: 1.2;
    }

    .divider {
      width: min(505px, 90vw);
      height: 2px;
      margin-top: clamp(26px, 8vh, 27px);
      border: 0;
      background: rgba(255, 255, 255, 0.88);
    }

    .option-actions {
      display: grid;
      width: min(193px, 72vw);
      gap: 26px;
      margin-top: clamp(36px, 10vh, 37px);
    }

    .option-button {
      display: flex;
      min-height: 37px;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: rgba(45, 135, 195, 0.82);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: clamp(18px, 3.3vw, 18px);
      line-height: 1.1;
      text-decoration: none;
      white-space: nowrap;
    }

    .option-button:hover {
      background: rgba(61, 154, 212, 0.9);
    }

    @media (max-width: 560px) {
      .content {
        padding-inline: 20px;
      }

      .waves {
        height: 60%;
      }

      .option-actions {
        width: min(230px, 78vw);
      }

      .option-button {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main class="options-screen" aria-label="Opciones de TI y contabilidad">
    <svg class="waves" viewBox="0 0 543 348" preserveAspectRatio="none" aria-hidden="true">
      <path
        fill="#2b61ad"
        d="M0 139 C88 147 134 163 201 140 C260 120 308 88 371 130 C429 169 467 173 543 143 L543 348 L0 348 Z"
      />
      <path
        fill="#243b97"
        d="M0 230 C82 253 126 235 185 197 C242 161 297 214 359 236 C416 256 483 242 543 233 L543 348 L0 348 Z"
      />
      <path
        fill="#1b2476"
        d="M0 280 C88 286 144 282 223 276 C310 268 384 285 543 266 L543 348 L0 348 Z"
      />
    </svg>

    <section class="content">
      <h1 class="page-title">TI / Contabilidad</h1>
      <hr class="divider">

      <nav class="option-actions" aria-label="Acciones de TI y contabilidad">
        <a class="option-button" href="gestionar-equipos.html">Gestionar equipos</a>
        <a class="option-button" href="consultar-inventario.html">Consultar inventario</a>
        <a class="option-button" href="historial.html">Ver historial</a>
      </nav>
    </section>
  </main>
</body>
</html>
