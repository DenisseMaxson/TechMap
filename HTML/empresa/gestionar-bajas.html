<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMap - Gestionar bajas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #3385bd;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .bajas-screen {
      min-height: 100vh;
      padding: 15px clamp(14px, 3vw, 28px) 18px;
      background: #3385bd;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 920px;
      margin: 0 auto 22px;
    }

    .page-title {
      font-size: clamp(18px, 3vw, 21px);
      font-weight: 400;
      line-height: 1.2;
    }

    .back-link {
      display: inline-flex;
      width: 34px;
      height: 34px;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
    }

    .back-icon {
      width: 31px;
      height: 31px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 3;
    }

    .toolbar {
      display: flex;
      max-width: 920px;
      margin: 0 auto 10px;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .filter-select,
    .reset-button {
      min-height: 31px;
      border: 0;
      border-radius: 7px;
      background: rgba(18, 33, 98, 0.9);
      color: #ffffff;
      font-size: 13px;
      outline: 0;
    }

    .filter-select {
      padding: 0 9px;
    }

    .reset-button {
      padding: 0 12px;
      cursor: pointer;
    }

    .reset-button:hover {
      background: #172a79;
    }

    .table-wrap {
      max-width: 920px;
      margin: 0 auto;
      overflow-x: auto;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(18, 33, 98, 0.28);
    }

    table {
      width: 100%;
      min-width: 690px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      height: 35px;
      border-right: 1px solid rgba(255, 255, 255, 0.38);
      border-bottom: 1px solid rgba(255, 255, 255, 0.28);
      padding: 0 8px;
      text-align: center;
      vertical-align: middle;
    }

    th:last-child,
    td:last-child {
      border-right: 0;
    }

    thead th {
      height: 40px;
      background: #11174f;
      color: #ffffff;
      font-size: 12px;
      font-weight: 400;
    }

    tbody td {
      background: rgba(31, 78, 128, 0.76);
      color: #ffffff;
      font-size: 12px;
    }

    tbody tr.is-approved td {
      background: rgba(39, 117, 105, 0.78);
    }

    tbody tr.is-rejected td {
      background: rgba(109, 55, 83, 0.78);
    }

    .id-column {
      width: 56px;
    }

    .serial-column {
      width: 92px;
    }

    .status-column {
      width: 78px;
    }

    .actions-column {
      width: 118px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 18px;
    }

    .icon-button {
      display: inline-flex;
      width: 22px;
      height: 22px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: #ffffff;
      color: #1b5390;
      cursor: pointer;
    }

    .icon-button svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 3;
    }

    .icon-button:hover {
      background: #dff1ff;
    }

    .icon-button.reject {
      color: #10235b;
    }

    .empty-message {
      padding: 18px;
      background: rgba(31, 78, 128, 0.76);
      color: #ffffff;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 560px) {
      .bajas-screen {
        padding-inline: 10px;
      }

      .top-bar,
      .toolbar {
        max-width: 100%;
      }

      .toolbar {
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <main class="bajas-screen" aria-label="Gestionar bajas">
    <header class="top-bar">
      <h1 class="page-title">Gestionar bajas</h1>
      <a class="back-link" href="opciones-jefe-area.html" aria-label="Regresar">
        <svg class="back-icon" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M12 8 5 15l7 7" />
          <path d="M6 15h14a7 7 0 1 1 0 14" />
        </svg>
      </a>
    </header>

    <section class="toolbar" aria-label="Filtros de bajas">
      <select class="filter-select" id="statusFilter" aria-label="Filtrar por estado">
        <option value="todos">Todos</option>
        <option value="pendiente">Pendientes</option>
        <option value="aprobada">Aprobadas</option>
        <option value="rechazada">Rechazadas</option>
      </select>
      <button class="reset-button" type="button" id="resetButton">Restaurar</button>
    </section>

    <section class="table-wrap" aria-label="Solicitudes de baja">
      <table>
        <thead>
          <tr>
            <th class="id-column">ID</th>
            <th>Dispositivo</th>
            <th class="serial-column">Num. Serie</th>
            <th>Solicitante</th>
            <th class="status-column">Estado</th>
            <th class="actions-column">Acciones</th>
          </tr>
        </thead>
        <tbody id="bajasTable"></tbody>
      </table>
      <p class="empty-message" id="emptyMessage" hidden>No hay solicitudes con ese estado.</p>
    </section>
  </main>

  <script>
    const initialRequests = [
      { id: '001', dispositivo: 'Dell Latitude', serie: '88181111', solicitante: 'Tyler Joseph', estado: 'pendiente' },
      { id: '002', dispositivo: 'HP LaserJet', serie: '88181112', solicitante: 'Denisse Valadez', estado: 'pendiente' },
      { id: '003', dispositivo: 'Teclado Logitech', serie: '88181113', solicitante: 'Andrea Monreal', estado: 'pendiente' },
      { id: '004', dispositivo: 'Mouse Microsoft', serie: '88181114', solicitante: 'Draco Malfoy', estado: 'pendiente' },
      { id: '005', dispositivo: 'Monitor LG', serie: '88181115', solicitante: 'Higgs Monaghan', estado: 'pendiente' },
      { id: '006', dispositivo: 'Dell Latitude', serie: '88181116', solicitante: 'Rhea Ripley', estado: 'pendiente' },
      { id: '007', dispositivo: 'Dell Latitude', serie: '88181117', solicitante: 'Danhausen', estado: 'pendiente' }
    ];

    let requests = initialRequests.map((request) => ({ ...request }));
    const tableBody = document.getElementById('bajasTable');
    const emptyMessage = document.getElementById('emptyMessage');
    const statusFilter = document.getElementById('statusFilter');

    const labels = {
      pendiente: 'Activo',
      aprobada: 'Baja aprobada',
      rechazada: 'Rechazada'
    };

    const rowClass = {
      pendiente: '',
      aprobada: 'is-approved',
      rechazada: 'is-rejected'
    };

    const setStatus = (id, estado) => {
      requests = requests.map((request) => (
        request.id === id ? { ...request, estado } : request
      ));
      renderRequests();
    };

    const actionButtons = (request) => {
      const disabled = request.estado !== 'pendiente' ? 'disabled' : '';
      return `
        <div class="actions">
          <button class="icon-button approve" type="button" data-action="aprobada" data-id="${request.id}" ${disabled} aria-label="Aprobar baja de ${request.dispositivo}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7" /></svg>
          </button>
          <button class="icon-button reject" type="button" data-action="rechazada" data-id="${request.id}" ${disabled} aria-label="Rechazar baja de ${request.dispositivo}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12" /><path d="M18 6 6 18" /></svg>
          </button>
        </div>
      `;
    };

    const renderRequests = () => {
      const selectedStatus = statusFilter.value;
      const visibleRequests = selectedStatus === 'todos'
        ? requests
        : requests.filter((request) => request.estado === selectedStatus);

      tableBody.innerHTML = visibleRequests.map((request) => `
        <tr class="${rowClass[request.estado]}">
          <td>${request.id}</td>
          <td>${request.dispositivo}</td>
          <td>${request.serie}</td>
          <td>${request.solicitante}</td>
          <td>${labels[request.estado]}</td>
          <td>${actionButtons(request)}</td>
        </tr>
      `).join('');

      emptyMessage.hidden = visibleRequests.length > 0;
    };

    tableBody.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button || button.disabled) return;
      setStatus(button.dataset.id, button.dataset.action);
    });

    statusFilter.addEventListener('change', renderRequests);

    document.getElementById('resetButton').addEventListener('click', () => {
      requests = initialRequests.map((request) => ({ ...request }));
      statusFilter.value = 'todos';
      renderRequests();
    });

    renderRequests();
  </script>
</body>
</html>
