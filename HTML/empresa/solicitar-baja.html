<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMap - Solicitar baja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:    #3385bd;
      --dark:  #1b2476;
      --mid:   #243b97;
      --blue:  #2b61ad;
      --light: #58b4ec;
      --white: #ffffff;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--white);
      font-family: 'Outfit', Arial, sans-serif;
    }

    .request-screen {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      padding: 18px clamp(16px, 4vw, 28px) 32px;
      background: linear-gradient(135deg, #1d6093 0%, #3385bd 55%, #58b4ec 100%);
    }

    /* ── Ondas ── */
    .waves {
      position: absolute; inset: auto 0 0 0;
      width: 100%; height: 58%; z-index: 0;
    }

    /* ── Top bar y contenido ── */
    .top-bar, .content {
      position: relative; z-index: 1;
      width: min(760px, 100%);
      margin-inline: auto;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      animation: fadeDown 0.7s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .back-link, .profile-link {
      display: inline-flex; width: 38px; height: 38px;
      align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      background: rgba(29,96,147,0.35);
      color: var(--white); text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .profile-link { justify-self: end; }
    .back-link:hover, .profile-link:hover {
      background: rgba(29,96,147,0.6);
      border-color: rgba(255,255,255,0.38);
    }
    .top-icon {
      width: 20px; height: 20px; fill: none;
      stroke: rgba(255,255,255,0.85);
      stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;
    }
    .profile-icon { width: 20px; height: 20px; fill: rgba(255,255,255,0.85); }

    .title-wrap { text-align: center; }
    .page-title {
      font-size: clamp(17px, 1.8vw, 22px);
      font-weight: 700; letter-spacing: -0.2px;
    }
    .page-sub {
      margin-top: 4px; font-size: clamp(10px, 0.85vw, 12px);
      font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(255,255,255,0.38);
    }

    /* ── Divisor ── */
    .divider {
      width: min(760px, 100%); height: 1px;
      margin: 12px auto 18px; border: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
    }

    /* ── Formulario ── */
    .request-form {
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      background: rgba(29,96,147,0.25);
      padding: clamp(18px, 4vw, 28px);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: fadeUp 0.75s 0.15s cubic-bezier(.22,1,.36,1) both;
    }

    .form-section-label {
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,0.35); margin-bottom: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px 18px;
    }

    .field-group {
      display: flex; flex-direction: column;
      gap: 5px; min-width: 0;
    }
    .field-group.full { grid-column: 1 / -1; }

    .field-label {
      font-size: clamp(11px, 0.9vw, 13px); font-weight: 400;
      color: rgba(255,255,255,0.65); letter-spacing: 0.04em;
    }

    .text-input, .select-input, .textarea-input {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 9px; outline: none;
      background: rgba(29,60,100,0.45);
      color: var(--white);
      font-family: 'Outfit', Arial, sans-serif;
      font-size: clamp(12px,1vw,14px);
      padding: 0 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .text-input, .select-input { height: 36px; }
    .textarea-input {
      min-height: 108px; padding: 10px 12px;
      resize: vertical; line-height: 1.5;
    }
    .text-input::placeholder,
    .textarea-input::placeholder { color: rgba(255,255,255,0.22); }
    .text-input:focus, .select-input:focus, .textarea-input:focus {
      border-color: rgba(88,180,236,0.65);
      box-shadow: 0 0 0 3px rgba(88,180,236,0.15);
    }
    .text-input[readonly] {
      background: rgba(29,60,100,0.25);
      color: rgba(255,255,255,0.5);
      cursor: default;
    }
    .select-input option { background: #1a3a6a; color: var(--white); }

    .request-form.was-validated :invalid {
      border-color: rgba(220,80,80,0.7);
      box-shadow: 0 0 0 3px rgba(160,40,40,0.18);
    }

    .field-help {
      font-size: 11px; font-weight: 300;
      color: rgba(255,255,255,0.38); line-height: 1.4;
    }

    /* ── Info card del equipo seleccionado ── */
    .equipment-info {
      display: none;
      align-items: center; gap: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(88,180,236,0.3);
      border-radius: 10px;
      background: rgba(35,127,185,0.2);
      margin-top: 4px;
      animation: fadeUp 0.3s ease both;
    }
    .equipment-info.visible { display: flex; }
    .equipment-info svg {
      width: 18px; height: 18px; flex-shrink: 0;
      stroke: rgba(88,180,236,0.8); fill: none;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
    }
    .equipment-info p { font-size: 12px; font-weight: 300; color: rgba(255,255,255,0.7); line-height: 1.4; }
    .equipment-info strong { font-weight: 500; color: rgba(255,255,255,0.9); }

    /* ── Acciones ── */
    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px; margin-top: 18px;
    }

    .action-button {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 40px;
      border-radius: 11px; font-family: 'Outfit', Arial, sans-serif;
      font-size: clamp(13px,1.1vw,15px); font-weight: 500; cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.2s, border-color 0.2s, transform 0.18s;
    }
    .action-button svg {
      width: 16px; height: 16px; fill: none; stroke: currentColor;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .action-button:hover { transform: translateY(-2px); }
    .action-button:active { transform: translateY(0); }

    .action-button.secondary {
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(80,80,120,0.3); color: rgba(255,255,255,0.65);
    }
    .action-button.secondary:hover {
      background: rgba(80,80,120,0.5); color: var(--white);
      border-color: rgba(255,255,255,0.3);
    }
    .action-button.primary {
      border: 1px solid rgba(220,80,80,0.45);
      background: rgba(160,40,40,0.35); color: rgba(255,200,200,0.9);
    }
    .action-button.primary:hover {
      background: rgba(160,40,40,0.55);
      border-color: rgba(220,80,80,0.65);
      color: rgba(255,220,220,1);
    }

    /* ── Toast ── */
    .toast {
      position: fixed; right: 18px; bottom: 18px; z-index: 10;
      max-width: min(340px, calc(100vw - 36px));
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      background: rgba(17,23,79,0.94);
      color: var(--white); padding: 12px 16px;
      font-size: 13px; font-weight: 400; line-height: 1.4;
      opacity: 0; transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
      backdrop-filter: blur(12px);
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: rgba(22,110,82,0.94); border-color: rgba(80,200,140,0.35); }
    .toast.error   { background: rgba(132,42,58,0.94);  border-color: rgba(220,80,80,0.35); }

    @media (max-width: 620px) {
      .form-grid, .actions { grid-template-columns: 1fr; }
      .field-group.full { grid-column: 1; }
    }
  </style>
</head>
<body>
  <main class="request-screen" aria-label="Solicitar baja de equipo">

    <svg class="waves" viewBox="0 0 543 348" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#2b61ad" d="M0 139 C88 147 134 163 201 140 C260 120 308 88 371 130 C429 169 467 173 543 143 L543 348 L0 348 Z"/>
      <path fill="#243b97" d="M0 230 C82 253 126 235 185 197 C242 161 297 214 359 236 C416 256 483 242 543 233 L543 348 L0 348 Z"/>
      <path fill="#1b2476" d="M0 280 C88 286 144 282 223 276 C310 268 384 285 543 266 L543 348 L0 348 Z"/>
    </svg>

    <header class="top-bar">
      <a class="back-link" href="opciones-ti-contabilidad.html" aria-label="Regresar">
        <svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </a>
      <div class="title-wrap">
        <h1 class="page-title">Solicitar baja</h1>
        <p class="page-sub">Envío de solicitud para revisión</p>
      </div>
      <a class="profile-link" href="perfil-empresa.html" aria-label="Perfil">
        <svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12c2.35 0 4.25-1.9 4.25-4.25S14.35 3.5 12 3.5s-4.25 1.9-4.25 4.25S9.65 12 12 12Zm0 2c-3.95 0-7.5 2.02-7.5 4.25V20h15v-1.75C19.5 16.02 15.95 14 12 14Z"/>
        </svg>
      </a>
    </header>

    <hr class="divider">

    <section class="content">
      <form class="request-form" id="requestForm" novalidate>
        <p class="form-section-label">Datos de la solicitud</p>
        <div class="form-grid">

          <label class="field-group full">
            <span class="field-label">Equipo</span>
            <select class="select-input" name="equipo_id" id="equipmentSelect" required>
              <option value="">Selecciona un equipo</option>
            </select>
            <span class="field-help" id="equipmentHelp">Elige el equipo que requiere baja.</span>
          </label>

          <div class="equipment-info full" id="equipmentInfo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <path d="M8 21h8M12 17v4"/>
            </svg>
            <p id="equipmentInfoText"></p>
          </div>

          <label class="field-group">
            <span class="field-label">Número de serie</span>
            <input class="text-input" type="text" name="serie" id="serialInput" readonly
                   placeholder="Se completa al seleccionar equipo">
          </label>

          <label class="field-group">
            <span class="field-label">Área</span>
            <input class="text-input" type="text" name="area" id="areaInput" readonly data-id=""
                   placeholder="Se completa al seleccionar equipo">
          </label>

          <label class="field-group full">
            <span class="field-label">Motivo de la baja</span>
            <textarea class="textarea-input" name="motivo" id="txtMotivo" minlength="12" required
                      placeholder="Describe el motivo detallado de la baja..."></textarea>
            <span class="field-help">Mínimo 12 caracteres.</span>
          </label>

          <label class="field-group full">
            <span class="field-label">Evidencia o referencia (opcional)</span>
            <input class="text-input" type="text" name="evidencia" id="txtEvidencia"
                   placeholder="Liga, folio, reporte interno o comentario corto">
          </label>

        </div>

        <div class="actions">
          <button class="action-button secondary" type="button" id="clearButton">
            <svg viewBox="0 0 24 24"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
            Limpiar
          </button>
          <button class="action-button primary" type="submit">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            Enviar solicitud
          </button>
        </div>
      </form>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // Llaves locales (Se mantienen para no romper el rastro de historial local si lo usan)
    const HISTORY_KEY   = 'techmap_historial_empresa';

    const requestForm     = document.getElementById('requestForm');
    const equipmentSelect = document.getElementById('equipmentSelect');
    const serialInput     = document.getElementById('serialInput');
    const areaInput       = document.getElementById('areaInput');
    const equipmentInfo   = document.getElementById('equipmentInfo');
    const equipmentInfoTx = document.getElementById('equipmentInfoText');
    const toast           = document.getElementById('toast');
    let toastTimer;

    // Arreglo de respaldo con IDs numéricos reales y sus id_area correspondientes
    const fallbackEquipment = [
      { id: 1, nombre: 'Dell Latitude',  numero_serie: 'SN-DELL-001',  area: 'TI',           id_area: 1, encargado_equipo: 'Tyler Joseph' },
      { id: 2, nombre: 'HP EliteDesk',   numero_serie: 'SN-HP-002',    area: 'Contabilidad', id_area: 2, encargado_equipo: 'Denisse Valadez' },
      { id: 3, nombre: 'Cisco Catalyst', numero_serie: 'SN-CISCO-003', area: 'Redes',        id_area: 3, encargado_equipo: 'Andrea Monreal' }
    ];

    const showToast = (msg, type = 'success') => {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.className = `toast ${type} show`;
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
    };

    const getSession = () => {
      try { return JSON.parse(localStorage.getItem('techmap_session') || '{}'); }
      catch { return {}; }
    };

    // Puedes dejar que consuma del fallback o agregar un fetch inicial a tu endpoint 'GET /api/equipos' si ya lo tienes listo
    const equipment = fallbackEquipment;

    const saveHistory = (req) => {
      const session = getSession();
      const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      history.unshift({
        id: `MOV-${Date.now()}`,
        fecha: new Date().toISOString(),
        tipo: 'Solicitud baja',
        equipo: req.dispositivo,
        numero_serie: req.serie,
        usuario: session.nombre_completo || req.solicitante,
        detalle: `Solicitud de baja enviada: ${req.motivo}`
      });
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, 80)));
    };

    const populateEquipment = () => {
      equipment.forEach((item) => {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = `${item.nombre || 'Equipo'} — ${item.numero_serie || 'Sin serie'}`;
        equipmentSelect.appendChild(opt);
      });
    };

    const selectedEquipment = () => equipment.find(e => String(e.id) === String(equipmentSelect.value));

    equipmentSelect.addEventListener('change', () => {
      const item = selectedEquipment();
      serialInput.value = item?.numero_serie || '';
      areaInput.value   = item?.area         || '';
      areaInput.setAttribute('data-id', item?.id_area || ''); // Almacena el ID numérico de la zona
      
      if (item) {
        equipmentInfoTx.innerHTML = `<strong>${item.nombre}</strong> · Serie: ${item.numero_serie} · Encargado: ${item.encargado_equipo || '—'}`;
        equipmentInfo.classList.add('visible');
      } else {
        equipmentInfo.classList.remove('visible');
      }
    });

    document.getElementById('clearButton').addEventListener('click', () => {
      requestForm.reset();
      requestForm.classList.remove('was-validated');
      serialInput.value = '';
      areaInput.value   = '';
      areaInput.setAttribute('data-id', '');
      equipmentInfo.classList.remove('visible');
      showToast('Formulario limpio.', 'success');
    });

    // ── Conexión Fetch con el Servidor Backend (Node.js) ──
    requestForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      requestForm.classList.add('was-validated');

      if (!requestForm.checkValidity()) {
        showToast('Revisa los campos marcados antes de enviar.', 'error');
        return;
      }

      const item    = selectedEquipment();
      const session = getSession();

      // Recolección estructurada para el Body JSON
      const datosBaja = {
        id_equipo:   parseInt(item.id),
        motivo:      document.getElementById('txtMotivo').value.trim(),
        id_area:     parseInt(areaInput.getAttribute('data-id')),
        solicitante: session.nombre_completo || item.encargado_equipo || 'Usuario empresa'
      };

      try {
        // Petición POST al endpoint de Node.js
        const response = await fetch('http://localhost:3000/api/equipos/solicitar-baja', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(datosBaja)
        });

        const resultado = await response.json();

        if (resultado.success) {
          // Si guardó en BD, actualizamos historial local de apoyo
          saveHistory({
            dispositivo: item.nombre,
            serie: item.numero_serie,
            solicitante: datosBaja.solicitante,
            motivo: datosBaja.motivo
          });

          // Resetear los estados de la interfaz
          requestForm.reset();
          requestForm.classList.remove('was-validated');
          serialInput.value = '';
          areaInput.value   = '';
          areaInput.setAttribute('data-id', '');
          equipmentInfo.classList.remove('visible');

          // Desplegamos el toast de éxito
          showToast(resultado.message, 'success');
        } else {
          showToast(`Error: ${resultado.message}`, 'error');
        }

      } catch (error) {
        console.error('Error al conectar con el backend:', error);
        showToast('No se pudo establecer conexión con el servidor de TechMap.', 'error');
      }
    });

    populateEquipment();
  </script>
</body>
</html>
