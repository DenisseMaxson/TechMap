<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMap - Inventario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:    #3385bd;
      --dark:  #1b2476;
      --mid:   #2e4aa9;
      --blue:  #2b61ad;
      --light: #58b4ec;
      --navy:  #11174f;
      --white: #ffffff;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--white);
      font-family: 'Outfit', Arial, sans-serif;
    }

    .inventory-screen {
      min-height: 100vh;
      padding: 16px clamp(14px, 3vw, 24px) 32px;
      background: linear-gradient(135deg, #1d6093 0%, #3385bd 55%, #58b4ec 100%);
      position: relative;
    }

    /* ── Top bar ── */
    .top-bar {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      max-width: 960px;
      margin: 0 auto;
      animation: fadeDown 0.7s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .back-link {
      display: inline-flex;
      width: 38px; height: 38px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      background: rgba(29,96,147,0.35);
      color: var(--white);
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .back-link:hover {
      background: rgba(29,96,147,0.6);
      border-color: rgba(255,255,255,0.38);
    }
    .back-icon {
      width: 20px; height: 20px;
      fill: none;
      stroke: rgba(255,255,255,0.85);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .title-wrap {
      text-align: center;
    }
    .page-title {
      font-size: clamp(17px, 1.8vw, 22px);
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .page-sub {
      font-size: clamp(10px, 0.85vw, 12px);
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      margin-top: 3px;
    }

    .profile-link {
      justify-self: end;
      display: inline-flex;
      width: 38px; height: 38px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      background: rgba(29,96,147,0.35);
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .profile-link:hover {
      background: rgba(29,96,147,0.6);
      border-color: rgba(255,255,255,0.38);
    }
    .profile-icon {
      width: 20px; height: 20px;
      fill: rgba(255,255,255,0.85);
    }

    /* ── Divisor ── */
    .divider {
      max-width: 960px;
      height: 1px;
      margin: 12px auto 16px;
      border: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
    }

    /* ── Toolbar ── */
    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      gap: 10px;
      max-width: 960px;
      margin: 0 auto 14px;
      animation: fadeDown 0.7s 0.1s cubic-bezier(.22,1,.36,1) both;
    }

    .search-wrap {
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      stroke: rgba(255,255,255,0.38);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      pointer-events: none;
    }

    .search-input,
    .type-filter {
      height: 36px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 9px;
      outline: none;
      background: rgba(17,23,79,0.55);
      color: var(--white);
      font-family: 'Outfit', Arial, sans-serif;
      font-size: clamp(12px, 1vw, 13px);
      padding: 0 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    .search-input { padding-left: 36px; }
    .search-input::placeholder { color: rgba(255,255,255,0.38); }
    .search-input:focus,
    .type-filter:focus {
      border-color: rgba(88,180,236,0.6);
      box-shadow: 0 0 0 3px rgba(88,180,236,0.14);
    }
    .type-filter option {
      background: #1a3a6a;
      color: var(--white);
    }

    /* ── Contador ── */
    .record-count {
      max-width: 960px;
      margin: 0 auto 8px;
      font-size: 11px;
      font-weight: 300;
      color: rgba(255,255,255,0.38);
      letter-spacing: 0.06em;
    }

    /* ── Tabla ── */
    .table-wrap {
      max-width: 960px;
      margin: 0 auto;
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: fadeUp 0.75s 0.15s cubic-bezier(.22,1,.36,1) both;
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      height: 40px;
      border-right: 1px solid rgba(255,255,255,0.1);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 0 10px;
      text-align: center;
      vertical-align: middle;
    }
    th:last-child, td:last-child { border-right: 0; }
    tr:last-child td { border-bottom: 0; }

    thead th {
      background: rgba(17,23,79,0.75);
      color: rgba(255,255,255,0.75);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    thead th:first-child { border-radius: 13px 0 0 0; }
    thead th:last-child  { border-radius: 0 13px 0 0; }

    tbody td {
      background: rgba(29,96,147,0.22);
      color: rgba(255,255,255,0.85);
      font-size: clamp(11px, 0.95vw, 13px);
    }
    tbody tr:hover td {
      background: rgba(45,107,169,0.42);
    }

    /* Badge de estado */
    .status-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .status-activo  { background: rgba(22,110,82,0.4);  border: 1px solid rgba(80,200,140,0.4);  color: #7ddfb0; }
    .status-baja    { background: rgba(160,40,40,0.35); border: 1px solid rgba(220,80,80,0.4);   color: #f4a0a0; }
    .status-default { background: rgba(80,80,120,0.35); border: 1px solid rgba(140,140,200,0.3); color: rgba(255,255,255,0.7); }

    .id-column     { width: 56px; }
    .serial-column { width: 110px; }
    .type-column   { width: 90px; }
    .status-column { width: 100px; }
    .date-column   { width: 110px; }

    /* ── Mensaje vacío ── */
    .empty-message {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      background: rgba(29,96,147,0.2);
      color: rgba(255,255,255,0.45);
      text-align: center;
      font-size: 13px;
      font-weight: 300;
      backdrop-filter: blur(8px);
    }

    @media (max-width: 620px) {
      .toolbar { grid-template-columns: 1fr; }
    }
    /* Modal: combinación - panel claro interior sobre marco azul del tema */
    .tm-modal-overlay {
      position: fixed; inset: 0; background: rgba(11,24,60,0.6); display: none; align-items: center; justify-content: center; z-index: 1200;
      padding: 20px;
    }
    .tm-modal-overlay.show { display: flex; }
    .tm-modal {
      width: min(920px, 96%);
      max-height: 86vh;
      overflow: auto;
      background: linear-gradient(180deg, #1b2476 0%, #243b97 55%, #2e4aa9 100%);
      color: #ffffff;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(6,18,60,0.6);
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      display: flex; justify-content: center;
    }
    .tm-modal-content {
      width: 100%; max-width: 860px; background: #ffffff; color: #11174f; border-radius: 10px; padding: 0; box-shadow: 0 6px 22px rgba(3,10,40,0.14); display:flex; flex-direction:column;
    }
    .tm-modal-body { padding:16px; overflow:auto; max-height:62vh }
    .tm-modal header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:6px }
    .tm-modal h3 { margin:0; font-size:18px; color: #ffffff }
    .tm-modal .close-btn { background:transparent;border:0;font-size:18px;cursor:pointer;color:rgba(255,255,255,0.95) }
    .tm-modal-content .modal-header { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px }
    .tm-modal-content .title { font-size:16px; font-weight:700; color:#1b2476 }
    .tm-modal-content table { width:100%; border-collapse:collapse; font-size:14px }
    .tm-modal-content td { padding:8px 10px; vertical-align:top; border-bottom:1px solid rgba(17,23,79,0.06); color: #11174f }
    .tm-modal-content td.label { width:34%; font-weight:700; color:#1b2476 }
    .tm-modal-footer { display:flex; gap:8px; justify-content:flex-end; margin-top:12px }
    .tm-btn { padding:8px 12px; border-radius:8px; border:0; cursor:pointer; font-weight:600 }
    .tm-btn.primary { background: #2e4aa9; color: #ffffff }
    .tm-btn.ghost { background: transparent; border:1px solid rgba(43,97,173,0.14); color:#2e4aa9 }
    .tm-btn.danger { background:#a04a4a; color:#ffffff }
  </style>
</head>
<body>
  <main class="inventory-screen" aria-label="Consultar inventario">

    <!-- Top bar -->
    <header class="top-bar">
      <a class="back-link" href="opciones-ti-contabilidad.html" aria-label="Regresar">
        <svg class="back-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </a>
      <div class="title-wrap">
        <h1 class="page-title">Inventario</h1>
        <p class="page-sub">Consulta de equipos</p>
      </div>
      <a class="profile-link" href="perfil-empresa.html" aria-label="Perfil">
        <svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12c2.35 0 4.25-1.9 4.25-4.25S14.35 3.5 12 3.5s-4.25 1.9-4.25 4.25S9.65 12 12 12Zm0 2c-3.95 0-7.5 2.02-7.5 4.25V20h15v-1.75C19.5 16.02 15.95 14 12 14Z"/>
        </svg>
      </a>
    </header>

    <hr class="divider">

    <!-- Toolbar -->
    <section class="toolbar" aria-label="Filtros de inventario">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input class="search-input" type="search" id="searchInput"
               placeholder="Buscar por dispositivo, serie, usuario o estado">
      </div>
      <select class="type-filter" id="typeFilter" aria-label="Filtrar por tipo">
        <option value="todos">Todos los tipos</option>
      </select>
    </section>

    <p class="record-count" id="recordCount" aria-live="polite"></p>

    <!-- Tabla -->
    <section class="table-wrap" aria-label="Tabla de inventario">
      <table>
        <thead>
          <tr>
            <th class="id-column">ID</th>
            <th>Dispositivo</th>
            <th class="serial-column">Núm. Serie</th>
            <th class="type-column">Tipo</th>
            <th>Usuario asignado</th>
            <th class="status-column">Estado</th>
            <th class="date-column">Fecha compra</th>
          </tr>
        </thead>
        <tbody id="inventoryTable"></tbody>
      </table>
    </section>

    <p class="empty-message" id="emptyMessage" hidden>
      No hay equipos que coincidan con la búsqueda.
    </p>

  <!-- Modal detalles de equipo -->
  <div class="tm-modal-overlay" id="detailModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="tm-modal" role="document">
      <button class="close-btn" id="modalCloseBtn" aria-label="Cerrar">✕</button>
      <div class="tm-modal-content">
        <div class="modal-header" style="padding:12px 16px;">
          <div class="title" id="modalTitle">Detalles del equipo</div>
        </div>
        <div id="modalBody" class="tm-modal-body">
          <!-- contenido generado dinámicamente -->
        </div>
        <div class="tm-modal-footer" style="padding:12px 16px;">
          <button class="tm-btn ghost" id="btnExport">Exportar PDF</button>
          <button class="tm-btn ghost" id="btnSolicitar">Solicitar baja</button>
          <button class="tm-btn primary" id="btnEditar">Editar</button>
          <button class="tm-btn" id="modalCloseBtnFooter">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  </main>

  <script>
    const API_URL        = 'http://localhost:3000/api/equipos';
    const inventoryTable = document.getElementById('inventoryTable');
    const emptyMessage   = document.getElementById('emptyMessage');
    const searchInput    = document.getElementById('searchInput');
    const typeFilter     = document.getElementById('typeFilter');
    const recordCount    = document.getElementById('recordCount');

    const escapeHtml = (v) => String(v ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[c]));

    const formatId = (id, i) => {
      const n = String(id || '').match(/\d+/)?.[0];
      return n ? n.padStart(3,'0').slice(-3) : String(i+1).padStart(3,'0');
    };

    const formatDate = (v) => {
      if (!v) return '—';
      const [y,m,d] = v.split('-');
      return y && m && d ? `${d}/${m}/${y}` : v;
    };

    const statusBadge = (estado) => {
      const val = (estado || 'Activo').toLowerCase();
      const cls = val === 'activo' ? 'status-activo' : val.includes('baja') ? 'status-baja' : 'status-default';
      return `<span class="status-badge ${cls}">${escapeHtml(estado || 'Activo')}</span>`;
    };

    const getSession = () => {
      try { return JSON.parse(localStorage.getItem('techmap_session') || '{}'); }
      catch { return {}; }
    };

    const session = getSession();
    const empresaId = Number(session.empresa_id || 0);
    let equipment = [];

    const loadEquipment = async () => {
      if (!empresaId || !session.token) {
        window.location.href = 'companylogin.html';
        return;
      }

      try {
        const response = await fetch(`${API_URL}/empresa/${empresaId}`, {
          headers: {
            'Authorization': `Bearer ${session.token}`,
            'x-empresa-id': String(empresaId),
            'x-user-id': String(session.id || '')
          }
        });
        const data = await response.json();
        if (!response.ok) {
          if (response.status === 401 || response.status === 403) {
            window.location.href = 'companylogin.html';
            return;
          }
          throw new Error(data.error || 'No se pudo cargar inventario');
        }
        equipment = data.map((item) => ({
          ...item,
          fecha_compra: item.fecha_compra || (item.fecha_adquisicion ? String(item.fecha_adquisicion).slice(0, 10) : '')
        }));
      } catch (error) {
        equipment = [];
        console.error('Error cargando inventario:', error);
      }
      populateTypeFilter();
      renderInventory();
    };

    const populateTypeFilter = () => {
      const types = [...new Set(equipment.map(e => e.tipo).filter(Boolean))].sort();
      types.forEach(t => {
        const o = document.createElement('option');
        o.value = t.toLowerCase();
        o.textContent = t.charAt(0).toUpperCase() + t.slice(1);
        typeFilter.appendChild(o);
      });
    };

    const matchesSearch = (item, q) => [
      item.nombre, item.numero_serie, item.tipo,
      item.encargado_equipo, item.estado || 'Activo',
      item.area, item.ubicacion_fisica
    ].join(' ').toLowerCase().includes(q);

    const renderInventory = () => {
      const q    = searchInput.value.trim().toLowerCase();
      const type = typeFilter.value;
      const list = equipment.filter(item => {
        const typeOk = type === 'todos' || String(item.tipo || '').toLowerCase() === type;
        return typeOk && matchesSearch(item, q);
      });

      inventoryTable.innerHTML = list.map((item, i) => `
        <tr data-id="${escapeHtml(String(item.id))}" style="cursor:pointer">
          <td>${formatId(item.id, i)}</td>
          <td style="text-align:left">${escapeHtml(item.nombre || 'Dispositivo')}</td>
          <td>${escapeHtml(item.numero_serie || '—')}</td>
          <td>${escapeHtml(item.tipo || '—')}</td>
          <td>${escapeHtml(item.encargado_equipo || '—')}</td>
          <td>${statusBadge(item.estado)}</td>
          <td>${escapeHtml(formatDate(item.fecha_compra))}</td>
        </tr>
      `).join('');

      // attach click handlers to open modal
      Array.from(inventoryTable.querySelectorAll('tr')).forEach((tr) => {
        tr.addEventListener('click', () => {
          const id = tr.getAttribute('data-id');
          const obj = equipment.find(e => String(e.id) === String(id));
          if (obj) showEquipmentModal(obj);
        });
      });

      emptyMessage.hidden = list.length > 0;
      recordCount.textContent = list.length > 0
        ? `${list.length} equipo${list.length !== 1 ? 's' : ''} encontrado${list.length !== 1 ? 's' : ''}`
        : '';
    };

    searchInput.addEventListener('input', renderInventory);
    typeFilter.addEventListener('change', renderInventory);
    // Modal handlers
    const modalOverlay = document.getElementById('detailModal');
    const modalBody = document.getElementById('modalBody');
    const modalTitle = document.getElementById('modalTitle');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalCloseBtnFooter = document.getElementById('modalCloseBtnFooter');
    const btnEditar = document.getElementById('btnEditar');
    const btnExport = document.getElementById('btnExport');
    const btnSolicitar = document.getElementById('btnSolicitar');

    const closeModal = () => {
      modalOverlay.classList.remove('show');
      modalOverlay.setAttribute('aria-hidden', 'true');
      modalBody.innerHTML = '';
      // clear handlers
      btnEditar.onclick = null;
      btnExport.onclick = null;
      btnSolicitar.onclick = null;
    };

    modalCloseBtn.addEventListener('click', closeModal);
    modalCloseBtnFooter.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    const htmlRow = (label, value) => `<tr><td class="label">${escapeHtml(label)}</td><td>${escapeHtml(value ?? '—')}</td></tr>`;
    const showEquipmentModal = (obj) => {
      modalTitle.textContent = obj.nombre || 'Detalles del equipo';
      const rows = [];
      rows.push(htmlRow('ID', obj.id));
      rows.push(htmlRow('Nombre', obj.nombre));
      rows.push(htmlRow('Número de serie', obj.numero_serie));
      rows.push(htmlRow('Tipo', obj.tipo));
      rows.push(htmlRow('Marca', obj.marca));
      rows.push(htmlRow('Modelo', obj.modelo));
      rows.push(htmlRow('Dirección MAC', obj.direccion_mac));
      rows.push(htmlRow('Dirección IP', obj.direccion_ip));
      rows.push(htmlRow('Área', obj.area));
      rows.push(htmlRow('Ubicación física', obj.ubicacion_fisica));
      rows.push(htmlRow('Encargado', obj.encargado_equipo));
      rows.push(htmlRow('Estado', obj.estado || 'Activo'));
      rows.push(htmlRow('Fecha de compra', formatDate(obj.fecha_compra)));
      rows.push(htmlRow('Lugar de compra', obj.lugar_compra));
      rows.push(htmlRow('Observaciones', obj.descripcion || obj.observaciones));
      modalBody.innerHTML = `<table>${rows.join('')}</table>`;
      // set action handlers
      btnEditar.onclick = () => { window.location.href = `gestionar-equipos.html?id=${encodeURIComponent(obj.id)}`; };
      btnExport.onclick = () => { window.open(`${API_URL}/export/${encodeURIComponent(obj.id)}`, '_blank'); };
      btnSolicitar.onclick = () => { window.location.href = `solicitar-baja.html?equipo=${encodeURIComponent(obj.id)}`; };

      modalOverlay.classList.add('show');
      modalOverlay.setAttribute('aria-hidden', 'false');
    };

    loadEquipment();
  </script>
</body>
</html>
