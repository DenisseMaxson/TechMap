<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMap - Mantenimientos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #3385bd;
      --navy: #11174f;
      --deep: #1b2476;
      --mid: #2b61ad;
      --light: #58b4ec;
      --white: #ffffff;
      --ok: #6ee7a8;
      --warn: #ffd166;
      --bad: #ff7d8a;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--white);
      font-family: 'Outfit', Arial, sans-serif;
    }

    .maintenance-screen {
      min-height: 100vh;
      padding: 16px clamp(14px, 3vw, 24px) 32px;
      background: linear-gradient(135deg, #1d6093 0%, #3385bd 55%, #58b4ec 100%);
    }

    .top-bar {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      max-width: 1080px;
      margin: 0 auto;
      animation: fadeDown 0.7s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .back-link,
    .profile-link {
      display: inline-flex;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      background: rgba(29,96,147,0.35);
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .profile-link { justify-self: end; }
    .back-link:hover,
    .profile-link:hover {
      background: rgba(29,96,147,0.6);
      border-color: rgba(255,255,255,0.38);
    }
    .back-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: rgba(255,255,255,0.85);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }
    .profile-icon {
      width: 20px;
      height: 20px;
      fill: rgba(255,255,255,0.85);
    }

    .title-wrap { text-align: center; }
    .page-title {
      font-size: clamp(17px, 1.8vw, 22px);
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .page-sub {
      margin-top: 3px;
      color: rgba(255,255,255,0.38);
      font-size: clamp(10px, 0.85vw, 12px);
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .divider {
      max-width: 1080px;
      height: 1px;
      margin: 12px auto 16px;
      border: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      max-width: 1080px;
      margin: 0 auto 14px;
      animation: fadeDown 0.7s 0.1s cubic-bezier(.22,1,.36,1) both;
    }

    .summary-item {
      min-height: 72px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      background: rgba(17,23,79,0.42);
      padding: 12px 14px;
      backdrop-filter: blur(10px);
    }
    .summary-value {
      display: block;
      font-size: clamp(20px, 2.4vw, 28px);
      font-weight: 700;
      line-height: 1;
    }
    .summary-label {
      display: block;
      margin-top: 7px;
      color: rgba(255,255,255,0.55);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px 150px 104px 170px 160px;
      gap: 10px;
      max-width: 1080px;
      margin: 0 auto 10px;
      animation: fadeDown 0.7s 0.15s cubic-bezier(.22,1,.36,1) both;
    }

    .search-wrap { position: relative; }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      width: 16px;
      height: 16px;
      transform: translateY(-50%);
      stroke: rgba(255,255,255,0.38);
      fill: none;
      stroke-width: 1.5;
      pointer-events: none;
    }

    .search-input,
    .select-input,
    .date-input,
    .text-input {
      width: 100%;
      height: 36px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 9px;
      outline: none;
      background: rgba(17,23,79,0.55);
      color: var(--white);
      font-family: 'Outfit', Arial, sans-serif;
      font-size: clamp(12px, 1vw, 13px);
      padding: 0 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input { padding-left: 36px; }
    .search-input::placeholder,
    .text-input::placeholder { color: rgba(255,255,255,0.35); }
    .search-input:focus,
    .select-input:focus,
    .date-input:focus,
    .text-input:focus {
      border-color: rgba(88,180,236,0.6);
      box-shadow: 0 0 0 3px rgba(88,180,236,0.14);
    }
    .select-input option { background: #1a3a6a; color: var(--white); }

    .action-button,
    .row-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 36px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 9px;
      background: rgba(43,97,173,0.45);
      color: var(--white);
      font-family: 'Outfit', Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    .action-button:hover,
    .row-button:hover {
      background: rgba(88,180,236,0.35);
      border-color: rgba(255,255,255,0.42);
      transform: translateY(-1px);
    }
    .action-button svg,
    .row-button svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: rgba(255,255,255,0.82);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .row-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .record-count {
      max-width: 1080px;
      margin: 0 auto 8px;
      color: rgba(255,255,255,0.42);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.06em;
    }

    .table-wrap {
      max-width: 1080px;
      margin: 0 auto;
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      animation: fadeUp 0.75s 0.2s cubic-bezier(.22,1,.36,1) both;
    }
    table {
      width: 100%;
      min-width: 960px;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      min-height: 42px;
      border-right: 1px solid rgba(255,255,255,0.1);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 9px 10px;
      text-align: center;
      vertical-align: middle;
    }
    th:last-child, td:last-child { border-right: 0; }
    tr:last-child td { border-bottom: 0; }
    thead th {
      background: rgba(17,23,79,0.75);
      color: rgba(255,255,255,0.72);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    tbody tr { background: rgba(17,23,79,0.32); transition: background 0.18s; }
    tbody tr:nth-child(even) { background: rgba(27,36,118,0.28); }
    tbody tr:hover { background: rgba(88,180,236,0.18); }
    td {
      color: rgba(255,255,255,0.78);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .left { text-align: left; }
    .empty-row { height: 86px; color: rgba(255,255,255,0.48); }

    .status-badge,
    .type-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 86px;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      font-size: 11px;
      font-weight: 500;
      text-transform: capitalize;
    }
    .status-programado { color: var(--warn); background: rgba(255,209,102,0.12); }
    .status-realizado { color: var(--ok); background: rgba(110,231,168,0.12); }
    .status-vencido { color: var(--bad); background: rgba(255,125,138,0.13); }
    .status-cancelado { color: rgba(255,255,255,0.56); background: rgba(255,255,255,0.08); }
    .type-badge { color: rgba(255,255,255,0.82); background: rgba(88,180,236,0.14); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(8,14,48,0.72);
      backdrop-filter: blur(6px);
    }
    .modal-overlay.show { display: flex; }
    .modal {
      width: min(520px, calc(100vw - 32px));
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 14px;
      background: rgba(17,23,79,0.95);
      padding: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.28);
    }
    .modal-title {
      margin-bottom: 4px;
      font-size: 17px;
      font-weight: 700;
    }
    .modal-sub {
      margin-bottom: 14px;
      color: rgba(255,255,255,0.48);
      font-size: 12px;
      line-height: 1.4;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .field-group.full { grid-column: 1 / -1; }
    .hidden { display: none; }
    .field-label {
      color: rgba(255,255,255,0.6);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    textarea.text-input {
      min-height: 82px;
      padding-top: 9px;
      resize: vertical;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
    }
    .ghost-button { background: rgba(255,255,255,0.08); }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 30;
      max-width: min(360px, calc(100vw - 36px));
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      background: rgba(17,23,79,0.92);
      color: rgba(255,255,255,0.86);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { border-color: rgba(255,125,138,0.45); }

    @media (max-width: 900px) {
      .summary-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .toolbar .search-wrap { grid-column: 1 / -1; }
    }

    @media (max-width: 560px) {
      .summary-grid,
      .toolbar,
      .form-grid { grid-template-columns: 1fr; }
      .field-group.full,
      .toolbar .search-wrap { grid-column: auto; }
      .modal-actions { flex-direction: column; }
      .action-button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="maintenance-screen" aria-label="Mantenimientos de activos">
    <header class="top-bar">
      <a class="back-link" href="opciones-ti-contabilidad.html" aria-label="Regresar">
        <svg class="back-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </a>
      <div class="title-wrap">
        <h1 class="page-title">Mantenimientos</h1>
        <p class="page-sub">Preventivos y correctivos</p>
      </div>
      <a class="profile-link" href="perfil-empresa.html" aria-label="Perfil">
        <svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12c2.35 0 4.25-1.9 4.25-4.25S14.35 3.5 12 3.5s-4.25 1.9-4.25 4.25S9.65 12 12 12Zm0 2c-3.95 0-7.5 2.02-7.5 4.25V20h15v-1.75C19.5 16.02 15.95 14 12 14Z"/>
        </svg>
      </a>
    </header>

    <hr class="divider">

    <section class="summary-grid" aria-label="Resumen de mantenimientos">
      <div class="summary-item">
        <span class="summary-value" id="totalCount">0</span>
      <span class="summary-label">Servicios</span>
      </div>
      <div class="summary-item">
        <span class="summary-value" id="scheduledCount">0</span>
        <span class="summary-label">Programados</span>
      </div>
      <div class="summary-item">
        <span class="summary-value" id="expiredCount">0</span>
        <span class="summary-label">Vencidos</span>
      </div>
      <div class="summary-item">
        <span class="summary-value" id="doneCount">0</span>
        <span class="summary-label">Realizados</span>
      </div>
    </section>

    <section class="toolbar" aria-label="Filtros y acciones">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input class="search-input" id="searchInput" type="search" placeholder="Buscar por equipo, serie, area o tecnico">
      </div>

      <select class="select-input" id="statusFilter" aria-label="Estado">
        <option value="todos">Todos los estados</option>
        <option value="programado">Programados</option>
        <option value="vencido">Vencidos</option>
        <option value="realizado">Realizados</option>
        <option value="cancelado">Cancelados</option>
      </select>

      <select class="select-input" id="typeFilter" aria-label="Tipo">
        <option value="todos">Todos los tipos</option>
        <option value="preventivo">Preventivo</option>
        <option value="correctivo">Correctivo</option>
      </select>

      <input class="date-input" id="yearInput" type="number" min="2000" max="2100" aria-label="Anio">

      <button class="action-button" type="button" id="programButton">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"/>
        </svg>
        Programar anio
      </button>

      <button class="action-button" type="button" id="correctiveButton">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14.7 6.3a4 4 0 0 0-5 5L4 17v3h3l5.7-5.7a4 4 0 0 0 5-5l-2.4 2.4-3-3 2.4-2.4Z"/>
        </svg>
        Correctivo
      </button>
    </section>

    <p class="record-count" id="recordCount">0 servicios encontrados</p>

    <section class="table-wrap" aria-label="Lista de mantenimientos">
      <table>
        <thead>
          <tr>
            <th style="width: 18%">Equipo</th>
            <th style="width: 12%">Serie</th>
            <th style="width: 12%">Area</th>
            <th style="width: 10%">Tipo</th>
            <th style="width: 11%">Frecuencia</th>
            <th style="width: 12%">Fecha</th>
            <th style="width: 12%">Estado</th>
            <th style="width: 13%">Accion</th>
          </tr>
        </thead>
        <tbody id="maintenanceBody">
          <tr><td class="empty-row" colspan="8">Cargando mantenimientos...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <div class="modal-overlay" id="maintenanceModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 class="modal-title" id="modalTitle">Registrar mantenimiento</h2>
      <p class="modal-sub" id="modalSub">Completa los datos del servicio realizado.</p>

      <form id="maintenanceForm">
        <div class="form-grid">
          <label class="field-group full hidden" id="equipmentField">
            <span class="field-label">Equipo</span>
            <select class="select-input" name="equipo_id" id="equipmentSelect"></select>
          </label>
          <label class="field-group">
            <span class="field-label">Fecha realizada</span>
            <input class="date-input" type="date" name="fecha_realizada" required>
          </label>
          <label class="field-group">
            <span class="field-label">Estado</span>
            <select class="select-input" name="estado">
              <option value="realizado">Realizado</option>
              <option value="cancelado">Cancelado</option>
              <option value="programado">Programado</option>
            </select>
          </label>
          <label class="field-group full">
            <span class="field-label">Tecnico responsable</span>
            <input class="text-input" type="text" name="tecnico_responsable" placeholder="Nombre del tecnico">
          </label>
          <label class="field-group full">
            <span class="field-label">Observaciones</span>
            <textarea class="text-input" name="observaciones" maxlength="1000" placeholder="Limpieza, respaldo, revision, refacciones, evidencia, etc."></textarea>
          </label>
        </div>
      </form>

      <div class="modal-actions">
        <button class="action-button ghost-button" type="button" id="cancelModal">Cancelar</button>
        <button class="action-button" type="button" id="saveMaintenance">Guardar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const API_URL = 'http://localhost:3000/api/mantenimientos';
    const EQUIPMENT_API = 'http://localhost:3000/api/equipos';
    const body = document.getElementById('maintenanceBody');
    const recordCount = document.getElementById('recordCount');
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const typeFilter = document.getElementById('typeFilter');
    const yearInput = document.getElementById('yearInput');
    const modal = document.getElementById('maintenanceModal');
    const form = document.getElementById('maintenanceForm');
    const equipmentField = document.getElementById('equipmentField');
    const equipmentSelect = document.getElementById('equipmentSelect');
    const toast = document.getElementById('toast');
    let maintenances = [];
    let equipment = [];
    let selectedMaintenance = null;
    let modalMode = 'scheduled';
    let toastTimer;

    const getSession = () => {
      try { return JSON.parse(localStorage.getItem('techmap_session') || sessionStorage.getItem('techmap_session') || '{}'); }
      catch { return {}; }
    };

    const session = getSession();
    const empresaId = Number(session.empresa_id || 0);
    const userId = Number(session.id || 0);
    const canManage = ['ti', 'administrador'].includes(String(session.rol || '').toLowerCase());

    yearInput.value = new Date().getFullYear();
    document.getElementById('programButton').style.display = canManage ? '' : 'none';
    document.getElementById('correctiveButton').style.display = canManage ? '' : 'none';

    const escapeHtml = (v) => String(v ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[c]));

    const formatDate = (value) => {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value).slice(0, 10);
      return date.toLocaleDateString('es-MX');
    };

    const todayText = () => new Date().toISOString().slice(0, 10);

    const request = async (url, options = {}) => {
      const response = await fetch(url, {
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.token || ''}`,
          'x-empresa-id': String(empresaId),
          'x-user-id': String(userId),
          ...(options.headers || {})
        },
        ...options
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || data.message || 'Error en la solicitud');
      return data;
    };

    const showToast = (message, type = 'success') => {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
    };

    const normalize = (value) => String(value || '').toLowerCase();

    const filteredMaintenances = () => {
      const text = normalize(searchInput.value);
      const status = statusFilter.value;
      const type = typeFilter.value;
      return maintenances.filter((item) => {
        const textOk = !text || [
          item.equipo,
          item.numero_serie,
          item.area,
          item.tecnico_responsable,
          item.frecuencia
        ].some((value) => normalize(value).includes(text));
        const statusOk = status === 'todos' || item.estado === status;
        const typeOk = type === 'todos' || item.tipo === type;
        return textOk && statusOk && typeOk;
      });
    };

    const updateSummary = () => {
      const counts = maintenances.reduce((acc, item) => {
        acc.total += 1;
        acc[item.estado] = (acc[item.estado] || 0) + 1;
        return acc;
      }, { total: 0, programado: 0, vencido: 0, realizado: 0 });

      document.getElementById('totalCount').textContent = counts.total;
      document.getElementById('scheduledCount').textContent = counts.programado || 0;
      document.getElementById('expiredCount').textContent = counts.vencido || 0;
      document.getElementById('doneCount').textContent = counts.realizado || 0;
    };

    const render = () => {
      updateSummary();
      const list = filteredMaintenances();
      const label = statusFilter.value === 'todos' ? 'servicios encontrados' : `servicios ${statusFilter.value}s`;
      recordCount.textContent = `${list.length} ${label}`;
      body.innerHTML = '';

      if (!list.length) {
        body.innerHTML = '<tr><td class="empty-row" colspan="8">No hay mantenimientos con esos filtros.</td></tr>';
        return;
      }

      list.forEach((item) => {
        const tr = document.createElement('tr');
        const done = item.estado === 'realizado' || item.estado === 'cancelado';
        tr.innerHTML = `
          <td class="left">${escapeHtml(item.equipo || 'Equipo')}</td>
          <td>${escapeHtml(item.numero_serie || '-')}</td>
          <td>${escapeHtml(item.area || '-')}</td>
          <td><span class="type-badge">${escapeHtml(item.tipo || 'preventivo')}</span></td>
          <td>${escapeHtml(item.frecuencia || '-')}</td>
          <td>${escapeHtml(formatDate(item.fecha_programada))}</td>
          <td><span class="status-badge status-${escapeHtml(item.estado || 'programado')}">${escapeHtml(item.estado || 'programado')}</span></td>
          <td>
            <button class="row-button" type="button" ${done ? 'disabled' : ''} data-id="${item.id}">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
              ${canManage ? 'Marcar' : 'Ver'}
            </button>
          </td>
        `;
        const button = tr.querySelector('.row-button');
        if (!canManage) button.disabled = true;
        button?.addEventListener('click', () => openModal(item));
        body.appendChild(tr);
      });
    };

    const loadMaintenances = async () => {
      if (!session.token || !empresaId) {
        window.location.href = 'companylogin.html';
        return;
      }

      try {
        maintenances = await request(`${API_URL}/empresa/${empresaId}`);
        if (statusFilter.value === 'todos' && maintenances.some((item) => item.estado === 'vencido')) {
          statusFilter.value = 'vencido';
        }
      } catch (error) {
        maintenances = [];
        showToast(error.message, 'error');
      }
      render();
    };

    const loadEquipment = async () => {
      try {
        equipment = await request(`${EQUIPMENT_API}/empresa/${empresaId}`);
        equipmentSelect.innerHTML = '<option value="">Selecciona un equipo</option>';
        equipment.forEach((item) => {
          const option = document.createElement('option');
          option.value = item.id;
          option.textContent = `${item.nombre || 'Equipo'} - ${item.numero_serie || 'Sin serie'}`;
          equipmentSelect.appendChild(option);
        });
      } catch (error) {
        equipment = [];
        equipmentSelect.innerHTML = '<option value="">No se pudieron cargar equipos</option>';
      }
    };

    const openModal = (item) => {
      selectedMaintenance = item;
      modalMode = 'scheduled';
      form.reset();
      equipmentField.classList.add('hidden');
      equipmentSelect.required = false;
      form.fecha_realizada.value = todayText();
      form.estado.value = 'realizado';
      form.tecnico_responsable.value = item.tecnico_responsable || session.nombre_completo || '';
      form.observaciones.value = item.observaciones || '';
      document.getElementById('modalTitle').textContent = item.equipo || 'Registrar mantenimiento';
      document.getElementById('modalSub').textContent = `${item.tipo || 'preventivo'} programado para ${formatDate(item.fecha_programada)}`;
      modal.classList.add('show');
      modal.setAttribute('aria-hidden', 'false');
    };

    const openCorrectiveModal = async () => {
      selectedMaintenance = null;
      modalMode = 'corrective';
      if (!equipment.length) await loadEquipment();
      form.reset();
      equipmentField.classList.remove('hidden');
      equipmentSelect.required = true;
      form.fecha_realizada.value = todayText();
      form.estado.value = 'realizado';
      form.tecnico_responsable.value = session.nombre_completo || '';
      document.getElementById('modalTitle').textContent = 'Registrar correctivo';
      document.getElementById('modalSub').textContent = 'Registra un servicio no programado para el equipo seleccionado.';
      modal.classList.add('show');
      modal.setAttribute('aria-hidden', 'false');
    };

    const closeModal = () => {
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden', 'true');
      selectedMaintenance = null;
    };

    document.getElementById('programButton').addEventListener('click', async () => {
      const year = Number(yearInput.value);
      if (!Number.isInteger(year) || year < 2000 || year > 2100) {
        showToast('Captura un anio valido.', 'error');
        return;
      }

      try {
        const result = await request(`${API_URL}/programar-preventivos`, {
          method: 'POST',
          body: JSON.stringify({ empresa_id: empresaId, usuario_id: userId, anio: year })
        });
        showToast(`${result.creados || 0} mantenimientos programados.`);
        await loadMaintenances();
      } catch (error) {
        showToast(error.message, 'error');
      }
    });

    document.getElementById('correctiveButton').addEventListener('click', openCorrectiveModal);

    document.getElementById('saveMaintenance').addEventListener('click', async () => {
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const data = Object.fromEntries(new FormData(form).entries());
      try {
        if (modalMode === 'corrective') {
          await request(API_URL, {
            method: 'POST',
            body: JSON.stringify({
              empresa_id: empresaId,
              usuario_id: userId,
              tipo: 'correctivo',
              frecuencia: 'manual',
              fecha_programada: data.fecha_realizada,
              ...data
            })
          });
        } else {
          if (!selectedMaintenance) return;
          await request(API_URL, {
            method: 'PUT',
            body: JSON.stringify({
              id: selectedMaintenance.id,
              empresa_id: empresaId,
              usuario_id: userId,
              ...data
            })
          });
        }
        closeModal();
        showToast(modalMode === 'corrective' ? 'Correctivo registrado.' : 'Mantenimiento actualizado.');
        await loadMaintenances();
      } catch (error) {
        showToast(error.message, 'error');
      }
    });

    document.getElementById('cancelModal').addEventListener('click', closeModal);
    modal.addEventListener('click', (event) => {
      if (event.target === modal) closeModal();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeModal();
    });

    searchInput.addEventListener('input', render);
    statusFilter.addEventListener('change', render);
    typeFilter.addEventListener('change', render);

    loadMaintenances();
    loadEquipment();
  </script>
</body>
</html>
