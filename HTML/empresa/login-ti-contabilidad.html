<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMap - TI/contabilidad</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #3385bd;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .company-screen {
      position: relative;
      display: flex;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      overflow: hidden;
      background: #3385bd;
    }

    .waves {
      position: absolute;
      inset: auto 0 0 0;
      width: 100%;
      height: 52%;
    }

    .waves path {
      shape-rendering: geometricPrecision;
    }

    .company-form {
      position: relative;
      z-index: 2;
      display: flex;
      width: min(590px, 82vw);
      flex-direction: column;
      align-items: center;
      padding-top: clamp(34px, 8vh, 76px);
      text-align: center;
    }

    .company-title {
      font-size: clamp(22px, 2.4vw, 34px);
      font-weight: 700;
      line-height: 1.2;
    }

    .role-title {
      margin-top: 10px;
      font-size: clamp(20px, 2.2vw, 29px);
      font-weight: 400;
      line-height: 1.2;
    }

    .divider {
      width: min(362px, 68vw);
      height: 2px;
      margin-top: clamp(26px, 6vh, 44px);
      border: 0;
      background: rgba(255, 255, 255, 0.78);
    }

    .field-group {
      width: min(297px, 72vw);
      margin-top: clamp(28px, 6vh, 42px);
    }

    .field-group + .field-group {
      margin-top: clamp(24px, 5vh, 34px);
    }

    .field-label {
      display: block;
      margin-bottom: 12px;
      font-size: clamp(21px, 2.2vw, 31px);
      font-weight: 400;
      line-height: 1.15;
    }

    .text-input {
      width: 100%;
      height: clamp(42px, 5vw, 54px);
      border: 0;
      border-radius: 11px;
      outline: 0;
      background: rgba(255, 255, 255, 0.74);
      color: #163b56;
      font-size: clamp(18px, 1.8vw, 24px);
      padding: 0 18px;
      text-align: center;
    }

    .text-input:focus {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.28);
    }

    .submit-button,
    .back-link {
      display: flex;
      width: min(220px, 62vw);
      min-height: clamp(42px, 5vw, 54px);
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 11px;
      background: #1d6093;
      color: #ffffff;
      font-size: clamp(18px, 2vw, 26px);
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
    }

    .submit-button {
      margin-top: clamp(30px, 6vh, 44px);
    }

    .back-link {
      margin-top: 14px;
      background: rgba(29, 96, 147, 0.78);
      font-size: clamp(16px, 1.6vw, 20px);
    }

    .submit-button:hover,
    .back-link:hover {
      background: #2673ac;
    }

    @media (max-width: 520px) {
      body {
        overflow-y: auto;
      }

      .company-screen {
        min-height: 100vh;
        overflow-y: auto;
      }

      .company-form {
        width: 88vw;
        padding-top: 8vh;
      }

      .waves {
        height: 56%;
      }

      .field-group {
        width: min(310px, 82vw);
      }
    }
  </style>
</head>
<body>
  <main class="company-screen" aria-label="Inicio de sesi&oacute;n TI y contabilidad">
    <svg class="waves" viewBox="0 0 1366 420" preserveAspectRatio="none" aria-hidden="true">
      <path
        fill="#1e72a7"
        d="M0 76 C154 101 293 126 453 115 C625 104 748 46 899 70 C1035 91 1134 97 1366 82 L1366 420 L0 420 Z"
      />
      <path
        fill="#2698d5"
        d="M0 190 C181 178 372 170 509 196 C670 227 785 262 977 254 C1137 247 1245 225 1366 204 L1366 420 L0 420 Z"
      />
      <path
        fill="#58b4ec"
        d="M0 318 C170 293 324 284 491 302 C679 321 768 372 956 374 C1115 376 1231 350 1366 322 L1366 420 L0 420 Z"
      />
    </svg>

    <form class="company-form">
      <h1 class="company-title">Bienvenido, empresa</h1>
      <p class="role-title">TI/contabilidad</p>
      <hr class="divider">

      <label class="field-group">
        <span class="field-label">Usuario</span>
        <input class="text-input" type="text" name="usuario" autocomplete="username">
      </label>

      <label class="field-group">
        <span class="field-label">Contrase&ntilde;a</span>
        <input class="text-input" type="password" name="contrasena" autocomplete="current-password">
      </label>

      <button class="submit-button" type="submit">Iniciar sesi&oacute;n</button>
      <a class="back-link" href="companylogin.html">Regresar</a>
    </form>
  </main>
</body>
</html>
