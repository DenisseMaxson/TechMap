<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMap - Gestionar Usuarios</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #111649;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .users-screen {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background: #111649;
      padding-bottom: 24px;
    }

    .waves {
      position: absolute;
      inset: auto 0 0 0;
      width: 100%;
      height: 52%;
    }

    .waves path {
      shape-rendering: geometricPrecision;
    }

    .top-bar {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      width: min(486px, calc(100vw - 32px));
      margin: 14px auto 0;
    }

    .back-link,
    .profile-link {
      display: flex;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: #ffffff;
      text-decoration: none;
    }

    .profile-link {
      justify-self: end;
    }

    .back-link:hover,
    .profile-link:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .top-icon {
      width: 29px;
      height: 29px;
      fill: currentColor;
    }

    .page-title {
      font-size: clamp(18px, 2.2vw, 23px);
      font-weight: 400;
      line-height: 1.2;
      text-align: center;
    }

    .divider {
      position: relative;
      z-index: 2;
      width: min(486px, calc(100vw - 32px));
      height: 2px;
      margin: 7px auto 0;
      border: 0;
      background: rgba(255, 255, 255, 0.78);
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(900px, calc(100vw - 34px));
      margin: 17px auto 0;
    }

    .user-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(14px, 3vw, 28px);
    }

    .user-card {
      min-height: 138px;
      border: 0;
      border-radius: 20px;
      background: #a9c9ec;
      color: #0e173b;
      padding: 11px 12px;
      text-align: left;
      cursor: pointer;
    }

    .user-card:hover {
      background: #bad7f2;
    }

    .user-name {
      display: block;
      margin-bottom: 10px;
      color: #0c1435;
      font-size: clamp(15px, 1.7vw, 20px);
      font-weight: 400;
      line-height: 1.1;
    }

    .user-detail {
      display: block;
      margin-top: 4px;
      font-size: clamp(11px, 1.1vw, 14px);
      line-height: 1.18;
    }

    .user-detail strong {
      font-weight: 400;
    }

    .user-form {
      width: min(790px, 86vw);
      margin: 10px auto 0;
      border-radius: 10px;
      background: rgba(69, 92, 158, 0.72);
      padding: 15px clamp(18px, 5vw, 54px) 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 0.78fr;
      gap: 12px 24px;
    }

    .field-group {
      display: flex;
      min-width: 0;
      flex-direction: column;
      text-align: left;
    }

    .field-group.full {
      grid-column: 1 / -1;
    }

    .field-label {
      margin-bottom: 5px;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(11px, 1vw, 13px);
      line-height: 1.1;
    }

    .text-input,
    .select-input {
      width: 100%;
      height: 25px;
      border: 0;
      border-radius: 8px;
      outline: 0;
      background: #dedede;
      color: #111649;
      font-size: 14px;
      padding: 0 10px;
    }

    .text-input:focus,
    .select-input:focus {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.22);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      width: min(745px, 82vw);
      margin: 14px auto 0;
    }

    .action-button {
      min-height: 20px;
      border: 0;
      border-radius: 7px;
      background: #3293cc;
      color: #ffffff;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
    }

    .action-button:hover {
      background: #43a3df;
    }

    @media (max-width: 760px) {
      .users-screen {
        overflow-y: auto;
      }

      .user-list {
        grid-template-columns: 1fr;
      }

      .user-card {
        min-height: 142px;
      }

      .user-form {
        width: 100%;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
      }

      .action-button {
        min-height: 36px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="users-screen" aria-label="Gestionar usuarios">
    <svg class="waves" viewBox="0 0 1366 420" preserveAspectRatio="none" aria-hidden="true">
      <path
        fill="#184f89"
        d="M0 76 C154 101 293 126 453 115 C625 104 748 46 899 70 C1035 91 1134 97 1366 82 L1366 420 L0 420 Z"
      />
      <path
        fill="#237fb9"
        d="M0 190 C181 178 372 170 509 196 C670 227 785 262 977 254 C1137 247 1245 225 1366 204 L1366 420 L0 420 Z"
      />
      <path
        fill="#69a1ce"
        d="M0 318 C170 293 324 284 491 302 C679 321 768 372 956 374 C1115 376 1231 350 1366 322 L1366 420 L0 420 Z"
      />
    </svg>

    <header class="top-bar">
      <a class="back-link" href="adminoptions.html" aria-label="Volver a opciones">
        <svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9.7 5.3 3 12l6.7 6.7 1.4-1.4L6.8 13H21v-2H6.8l4.3-4.3-1.4-1.4Z"/>
        </svg>
      </a>

      <h1 class="page-title">Gestionar Usuarios</h1>

      <a class="profile-link" href="adminprofile.html" aria-label="Perfil del administrador">
        <svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12c2.35 0 4.25-1.9 4.25-4.25S14.35 3.5 12 3.5s-4.25 1.9-4.25 4.25S9.65 12 12 12Zm0 2c-3.95 0-7.5 2.02-7.5 4.25V20h15v-1.75C19.5 16.02 15.95 14 12 14Z"/>
        </svg>
      </a>
    </header>

    <hr class="divider">

    <section class="content">
      <div class="user-list" aria-label="Lista de usuarios">
        <button class="user-card" type="button">
          <span class="user-name">Nombre completo</span>
          <span class="user-detail"><strong>Rol:</strong></span>
          <span class="user-detail"><strong>Empresa:</strong></span>
          <span class="user-detail"><strong>Estado:</strong></span>
          <span class="user-detail"><strong>Correo (opcional):</strong></span>
        </button>

        <button class="user-card" type="button">
          <span class="user-name">Nombre completo</span>
          <span class="user-detail"><strong>Rol:</strong></span>
          <span class="user-detail"><strong>Empresa:</strong></span>
          <span class="user-detail"><strong>Estado:</strong></span>
          <span class="user-detail"><strong>Correo (opcional):</strong></span>
        </button>

        <button class="user-card" type="button">
          <span class="user-name">Nombre completo</span>
          <span class="user-detail"><strong>Rol:</strong></span>
          <span class="user-detail"><strong>Empresa:</strong></span>
          <span class="user-detail"><strong>Estado:</strong></span>
          <span class="user-detail"><strong>Correo (opcional):</strong></span>
        </button>
      </div>

      <form class="user-form">
        <div class="form-grid">
          <label class="field-group full">
            <span class="field-label">Nombre completo:</span>
            <input class="text-input" type="text" name="nombre_completo">
          </label>

          <label class="field-group">
            <span class="field-label">Rol:</span>
            <select class="select-input" name="rol">
              <option value="">Seleccionar</option>
              <option value="administrador">Administrador</option>
              <option value="empresa">Empresa</option>
              <option value="usuario">Usuario</option>
            </select>
          </label>

          <label class="field-group">
            <span class="field-label">Empresa:</span>
            <input class="text-input" type="text" name="empresa">
          </label>

          <label class="field-group">
            <span class="field-label">Estado:</span>
            <select class="select-input" name="estado">
              <option value="">Seleccionar</option>
              <option value="activo">Activo</option>
              <option value="inactivo">Inactivo</option>
              <option value="pendiente">Pendiente</option>
            </select>
          </label>

          <label class="field-group">
            <span class="field-label">Correo (opcional):</span>
            <input class="text-input" type="email" name="correo">
          </label>
        </div>
      </form>

      <div class="actions" aria-label="Acciones de usuario">
        <button class="action-button" type="button">Editar</button>
        <button class="action-button" type="button">Agregar</button>
        <button class="action-button" type="button">Eliminar</button>
        <button class="action-button" type="button">Limpiar</button>
      </div>
    </section>
  </main>
</body>
</html>
