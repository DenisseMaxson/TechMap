<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMap - Perfil Administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy:  #111649;
      --blue1: #184f89;
      --blue2: #237fb9;
      --blue3: #3793d0;
      --sky:   #69a1ce;
      --white: #ffffff;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: var(--navy);
      color: var(--white);
      font-family: 'Outfit', Arial, sans-serif;
    }

    .profile-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--navy);
    }

    /* ── Partículas ── */
    .particles {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(55,147,208,0.15);
      animation: floatUp var(--d,8s) ease-in-out infinite var(--delay,0s);
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1);       opacity: 0; }
      20%  { opacity: 0.8; }
      80%  { opacity: 0.4; }
      100% { transform: translateY(-90px) scale(1.1); opacity: 0; }
    }

    /* ── Ondas ── */
    .waves {
      position: absolute;
      inset: auto 0 0 0;
      width: 100%;
      height: 52%;
      z-index: 1;
    }

    /* ── Botón volver ── */
    .home-link {
      position: absolute;
      z-index: 3;
      top: clamp(16px, 3vh, 24px);
      left: clamp(18px, 4vw, 28px);
      display: flex;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(105,161,206,0.25);
      border-radius: 10px;
      background: rgba(55,147,208,0.1);
      color: var(--white);
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
      animation: fadeDown 0.7s cubic-bezier(.22,1,.36,1) both;
    }
    .home-link:hover {
      background: rgba(55,147,208,0.28);
      border-color: rgba(105,161,206,0.5);
    }
    .home-icon {
      width: 20px;
      height: 20px;
      fill: rgba(255,255,255,0.85);
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ── Contenido ── */
    .profile-content {
      position: relative;
      z-index: 2;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      padding-top: clamp(28px, 8vh, 62px);
      text-align: center;
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: relative;
      animation: scaleIn 0.7s 0.1s cubic-bezier(.22,1,.36,1) both;
    }

    /* Anillo exterior animado */
    .avatar-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1.5px solid rgba(105,161,206,0.35);
      animation: rotateSlow 12s linear infinite;
    }
    .avatar-ring::before {
      content: "";
      position: absolute;
      top: -2px; left: 50%;
      transform: translateX(-50%);
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(105,161,206,0.7);
    }
    @keyframes rotateSlow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .avatar {
      position: relative;
      display: flex;
      width: clamp(100px, 14vw, 136px);
      height: clamp(100px, 14vw, 136px);
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(55,147,208,0.18);
      border: 2px solid rgba(105,161,206,0.45);
      backdrop-filter: blur(8px);
    }
    .avatar-icon {
      width: 52%;
      height: 52%;
      fill: rgba(255,255,255,0.9);
    }

    /* ── Info del perfil ── */
    .profile-info {
      animation: fadeUp 0.75s 0.2s cubic-bezier(.22,1,.36,1) both;
    }

    .profile-name {
      margin-top: clamp(18px, 3.5vh, 26px);
      font-size: clamp(20px, 2.2vw, 28px);
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--white);
    }

    .profile-role {
      margin-top: 6px;
      font-size: clamp(11px, 1vw, 13px);
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
    }

    /* ── Divisor ── */
    .divider {
      width: min(360px, calc(100vw - 48px));
      height: 1px;
      margin-top: clamp(22px, 4.5vh, 30px);
      border: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    }

    /* ── Card de info ── */
    .profile-card {
      width: min(340px, calc(100vw - 48px));
      margin-top: clamp(20px, 4vh, 28px);
      border: 1px solid rgba(105,161,206,0.22);
      border-radius: 16px;
      background: rgba(55,100,180,0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
      animation: fadeUp 0.75s 0.3s cubic-bezier(.22,1,.36,1) both;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .info-row:last-child { border-bottom: none; }

    .info-icon {
      width: 18px; height: 18px;
      stroke: rgba(105,161,206,0.8);
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .info-label {
      font-size: 11px;
      font-weight: 300;
      color: rgba(255,255,255,0.38);
      letter-spacing: 0.06em;
      display: block;
    }
    .info-value {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.85);
      display: block;
    }

    /* ── Botón cerrar sesión ── */
    .logout-button {
      display: flex;
      align-items: center;
      gap: 9px;
      width: min(340px, calc(100vw - 48px));
      min-height: clamp(42px, 5vw, 50px);
      justify-content: center;
      margin-top: clamp(20px, 4vh, 28px);
      border: 1px solid rgba(220,80,80,0.35);
      border-radius: 12px;
      background: rgba(160,40,40,0.22);
      color: rgba(255,200,200,0.85);
      font-family: 'Outfit', Arial, sans-serif;
      font-size: clamp(14px, 1.3vw, 17px);
      font-weight: 500;
      text-decoration: none;
      backdrop-filter: blur(6px);
      transition: background 0.22s, border-color 0.22s, color 0.22s, transform 0.18s;
      animation: fadeUp 0.75s 0.4s cubic-bezier(.22,1,.36,1) both;
    }
    .logout-button svg {
      width: 18px; height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .logout-button:hover {
      background: rgba(160,40,40,0.45);
      border-color: rgba(220,80,80,0.6);
      color: rgba(255,220,220,1);
      transform: translateY(-2px);
    }
    .logout-button:active { transform: translateY(0); }

    @media (max-width: 520px) {
      .waves { height: 56%; }
      .profile-content { padding-top: 8vh; }
    }
  </style>
</head>
<body>
  <main class="profile-screen" aria-label="Perfil del administrador">

    <!-- Partículas -->
    <div class="particles" id="particles" aria-hidden="true"></div>

    <!-- Ondas -->
    <svg class="waves" viewBox="0 0 1366 420" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#184f89"
        d="M0 76 C154 101 293 126 453 115 C625 104 748 46 899 70
           C1035 91 1134 97 1366 82 L1366 420 L0 420 Z"/>
      <path fill="#237fb9"
        d="M0 190 C181 178 372 170 509 196 C670 227 785 262 977 254
           C1137 247 1245 225 1366 204 L1366 420 L0 420 Z"/>
      <path fill="#69a1ce"
        d="M0 318 C170 293 324 284 491 302 C679 321 768 372 956 374
           C1115 376 1231 350 1366 322 L1366 420 L0 420 Z"/>
    </svg>

    <!-- Botón volver -->
    <a class="home-link" href="adminoptions.html" aria-label="Volver a opciones del administrador">
      <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.7 5.3 3 12l6.7 6.7 1.4-1.4L6.8 13H21v-2H6.8l4.3-4.3-1.4-1.4Z"/>
      </svg>
    </a>

    <!-- Contenido -->
    <section class="profile-content">

      <!-- Avatar con anillo -->
      <div class="avatar-wrap" aria-hidden="true">
        <div class="avatar-ring"></div>
        <div class="avatar">
          <svg class="avatar-icon" viewBox="0 0 24 24">
            <path d="M12 12c2.56 0 4.63-2.07 4.63-4.63S14.56 2.75 12 2.75 7.38 4.82 7.38 7.37 9.45 12 12 12Zm0 1.7c-4.31 0-8.18 2.2-8.18 4.64v1.91h16.36v-1.91c0-2.44-3.87-4.64-8.18-4.64Z"/>
          </svg>
        </div>
      </div>

      <!-- Info -->
      <div class="profile-info">
        <h1 class="profile-name">Ing. Gerardo</h1>
        <p class="profile-role">Administrador principal</p>
      </div>

      <hr class="divider">

      <!-- Card de detalles -->
      <div class="profile-card">
        <div class="info-row">
          <svg class="info-icon" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 9h18M9 3v18"/>
          </svg>
          <div>
            <span class="info-label">Empresa</span>
            <span class="info-value">León Servicios Computacionales</span>
          </div>
        </div>
        <div class="info-row">
          <svg class="info-icon" viewBox="0 0 24 24">
            <path d="M12 2l3 4h5l-1.5 5L21 14l-9 5-9-5 2.5-3L4 6h5z"/>
          </svg>
          <div>
            <span class="info-label">Rol</span>
            <span class="info-value">Administrador principal</span>
          </div>
        </div>
        <div class="info-row">
          <svg class="info-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 8v4l3 3"/>
          </svg>
          <div>
            <span class="info-label">Acceso</span>
            <span class="info-value">Global — todas las empresas</span>
          </div>
        </div>
      </div>

      <!-- Cerrar sesión -->
      <a class="logout-button" href="../inicio/index.html" aria-label="Cerrar sesión">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar sesión
      </a>

    </section>
  </main>

  <script>
    const pc = document.getElementById('particles');
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 5 + Math.random() * 16;
      p.style.cssText = `
        left:${Math.random()*100}%;
        bottom:${Math.random()*48}%;
        width:${size}px; height:${size}px;
        --d:${6+Math.random()*8}s;
        --delay:-${Math.random()*8}s;
      `;
      pc.appendChild(p);
    }
  </script>
</body>
</html>
