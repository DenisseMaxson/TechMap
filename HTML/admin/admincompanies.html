<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMap - Gestionar Empresas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #111649;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .companies-screen {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background: #111649;
      padding-bottom: 24px;
    }

    .waves {
      position: absolute;
      inset: auto 0 0 0;
      width: 100%;
      height: 52%;
    }

    .waves path {
      shape-rendering: geometricPrecision;
    }

    .top-bar {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      width: min(486px, calc(100vw - 32px));
      margin: 14px auto 0;
    }

    .back-link,
    .profile-link {
      display: flex;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: #ffffff;
      text-decoration: none;
    }

    .profile-link {
      justify-self: end;
    }

    .back-link:hover,
    .profile-link:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .top-icon {
      width: 29px;
      height: 29px;
      fill: currentColor;
    }

    .page-title {
      font-size: clamp(18px, 2.2vw, 23px);
      font-weight: 400;
      line-height: 1.2;
      text-align: center;
    }

    .divider {
      position: relative;
      z-index: 2;
      width: min(486px, calc(100vw - 32px));
      height: 2px;
      margin: 7px auto 0;
      border: 0;
      background: rgba(255, 255, 255, 0.78);
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(900px, calc(100vw - 34px));
      margin: 17px auto 0;
    }

    .company-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(14px, 3vw, 28px);
    }

    .company-card {
      min-height: 112px;
      border: 0;
      border-radius: 20px;
      background: #a9c9ec;
      color: #0e173b;
      padding: 11px 12px;
      text-align: left;
      cursor: pointer;
    }

    .company-card:hover {
      background: #bad7f2;
    }

    .company-card.selected {
      background: #d3e6f7;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.32);
    }

    .empty-message {
      grid-column: 1 / -1;
      color: rgba(255, 255, 255, 0.86);
      font-size: 15px;
      text-align: center;
    }

    .company-name {
      display: block;
      margin-bottom: 10px;
      color: #0c1435;
      font-size: clamp(15px, 1.7vw, 20px);
      font-weight: 400;
      line-height: 1.1;
    }

    .company-detail {
      display: block;
      margin-top: 4px;
      font-size: clamp(11px, 1.1vw, 14px);
      line-height: 1.18;
    }

    .company-detail strong {
      font-weight: 400;
    }

    .company-form {
      width: min(790px, 86vw);
      margin: 10px auto 0;
      border-radius: 10px;
      background: rgba(69, 92, 158, 0.72);
      padding: 15px clamp(18px, 5vw, 54px) 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 0.78fr;
      gap: 12px 24px;
    }

    .field-group {
      display: flex;
      min-width: 0;
      flex-direction: column;
      text-align: left;
    }

    .field-group.full {
      grid-column: 1 / -1;
    }

    .field-label {
      margin-bottom: 5px;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(11px, 1vw, 13px);
      line-height: 1.1;
    }

    .text-input {
      width: 100%;
      height: 25px;
      border: 0;
      border-radius: 8px;
      outline: 0;
      background: #dedede;
      color: #111649;
      font-size: 14px;
      padding: 0 10px;
    }

    .text-input:focus {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.22);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      width: min(745px, 82vw);
      margin: 14px auto 0;
    }

    .action-button {
      min-height: 20px;
      border: 0;
      border-radius: 7px;
      background: #3293cc;
      color: #ffffff;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
    }

    .action-button:hover {
      background: #43a3df;
    }

    @media (max-width: 760px) {
      .companies-screen {
        overflow-y: auto;
      }

      .company-list {
        grid-template-columns: 1fr;
      }

      .company-card {
        min-height: 128px;
      }

      .company-form {
        width: 100%;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
      }

      .action-button {
        min-height: 36px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="companies-screen" aria-label="Gestionar empresas">
    <svg class="waves" viewBox="0 0 1366 420" preserveAspectRatio="none" aria-hidden="true">
      <path
        fill="#184f89"
        d="M0 76 C154 101 293 126 453 115 C625 104 748 46 899 70 C1035 91 1134 97 1366 82 L1366 420 L0 420 Z"
      />
      <path
        fill="#237fb9"
        d="M0 190 C181 178 372 170 509 196 C670 227 785 262 977 254 C1137 247 1245 225 1366 204 L1366 420 L0 420 Z"
      />
      <path
        fill="#69a1ce"
        d="M0 318 C170 293 324 284 491 302 C679 321 768 372 956 374 C1115 376 1231 350 1366 322 L1366 420 L0 420 Z"
      />
    </svg>

    <header class="top-bar">
      <a class="back-link" href="adminoptions.html" aria-label="Volver a opciones">
        <svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9.7 5.3 3 12l6.7 6.7 1.4-1.4L6.8 13H21v-2H6.8l4.3-4.3-1.4-1.4Z"/>
        </svg>
      </a>

      <h1 class="page-title">Gestionar Empresas</h1>

      <a class="profile-link" href="adminprofile.html" aria-label="Perfil del administrador">
        <svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12c2.35 0 4.25-1.9 4.25-4.25S14.35 3.5 12 3.5s-4.25 1.9-4.25 4.25S9.65 12 12 12Zm0 2c-3.95 0-7.5 2.02-7.5 4.25V20h15v-1.75C19.5 16.02 15.95 14 12 14Z"/>
        </svg>
      </a>
    </header>

    <hr class="divider">

    <section class="content">
      <div class="company-list" aria-label="Lista de empresas" id="companyList"></div>

      <form class="company-form" id="companyForm">
        <div class="form-grid">
          <label class="field-group">
            <span class="field-label">Nombre de empresa:</span>
            <input class="text-input" type="text" name="nombre" required>
          </label>

          <label class="field-group">
            <span class="field-label">RFC:</span>
            <input class="text-input" type="text" name="rfc">
          </label>

          <label class="field-group full">
            <span class="field-label">Ubicaci&oacute;n:</span>
            <input class="text-input" type="text" name="ubicacion">
          </label>

          <label class="field-group">
            <span class="field-label">Tel&eacute;fono:</span>
            <input class="text-input" type="tel" name="telefono">
          </label>

          <label class="field-group">
            <span class="field-label">Correo de contacto:</span>
            <input class="text-input" type="email" name="correo_contacto">
          </label>
        </div>
      </form>

      <div class="actions" aria-label="Acciones de empresa">
        <button class="action-button" type="button" id="editButton">Editar</button>
        <button class="action-button" type="button" id="addButton">Agregar</button>
        <button class="action-button" type="button" id="deleteButton">Eliminar</button>
        <button class="action-button" type="button" id="clearButton">Limpiar</button>
      </div>
    </section>
  </main>
  <script>
    const API_URL = 'http://localhost:3000/api/empresas';
    const companyList = document.getElementById('companyList');
    const companyForm = document.getElementById('companyForm');
    let companies = [];
    let selectedCompanyId = null;

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    }[char]));

    const formData = () => Object.fromEntries(new FormData(companyForm).entries());

    const request = async (url, options = {}) => {
      const response = await fetch(url, {
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Error en la solicitud');
      return data;
    };

    const renderCompanies = () => {
      companyList.innerHTML = '';

      if (!companies.length) {
        companyList.innerHTML = '<p class="empty-message">No hay empresas registradas.</p>';
        return;
      }

      companies.forEach((company) => {
        const card = document.createElement('button');
        card.className = `company-card${company.id === selectedCompanyId ? ' selected' : ''}`;
        card.type = 'button';
        card.innerHTML = `
          <span class="company-name">${escapeHtml(company.nombre || 'Empresa sin nombre')}</span>
          <span class="company-detail"><strong>ID:</strong> ${escapeHtml(company.id || '')}</span>
          <span class="company-detail"><strong>Ubicaci&oacute;n:</strong> ${escapeHtml(company.ubicacion || 'Sin ubicaci&oacute;n')}</span>
          <span class="company-detail"><strong>Usuarios:</strong> ${company.cantidad_usuarios || 0}</span>
          <span class="company-detail"><strong>RFC:</strong> ${escapeHtml(company.rfc || 'Sin RFC')}</span>
        `;
        card.addEventListener('click', () => selectCompany(company));
        companyList.appendChild(card);
      });
    };

    const loadCompanies = async () => {
      try {
        companies = await request(API_URL);
        renderCompanies();
      } catch (error) {
        companyList.innerHTML = `<p class="empty-message">${error.message}</p>`;
      }
    };

    const selectCompany = (company) => {
      selectedCompanyId = company.id;
      companyForm.nombre.value = company.nombre || '';
      companyForm.rfc.value = company.rfc || '';
      companyForm.ubicacion.value = company.ubicacion || '';
      companyForm.telefono.value = company.telefono || '';
      companyForm.correo_contacto.value = company.correo_contacto || '';
      renderCompanies();
    };

    const clearForm = () => {
      selectedCompanyId = null;
      companyForm.reset();
      renderCompanies();
    };

    document.getElementById('addButton').addEventListener('click', async () => {
      try {
        await request(`${API_URL}/insert`, { method: 'POST', body: JSON.stringify(formData()) });
        clearForm();
        await loadCompanies();
      } catch (error) {
        alert(error.message);
      }
    });

    document.getElementById('editButton').addEventListener('click', async () => {
      if (!selectedCompanyId) return alert('Selecciona una empresa para editar.');
      try {
        await request(`${API_URL}/update`, {
          method: 'PUT',
          body: JSON.stringify({ id: selectedCompanyId, ...formData() })
        });
        clearForm();
        await loadCompanies();
      } catch (error) {
        alert(error.message);
      }
    });

    document.getElementById('deleteButton').addEventListener('click', async () => {
      if (!selectedCompanyId) return alert('Selecciona una empresa para eliminar.');
      if (!confirm('¿Eliminar esta empresa?')) return;
      try {
        await request(`${API_URL}/delete`, {
          method: 'DELETE',
          body: JSON.stringify({ id: selectedCompanyId })
        });
        clearForm();
        await loadCompanies();
      } catch (error) {
        alert(error.message);
      }
    });

    document.getElementById('clearButton').addEventListener('click', clearForm);
    loadCompanies();
  </script>
</body>
</html>
