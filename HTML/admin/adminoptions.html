<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMap - Opciones Administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy:  #111649;
      --blue1: #184f89;
      --blue2: #237fb9;
      --blue3: #3793d0;
      --sky:   #69a1ce;
      --white: #ffffff;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: var(--navy);
      color: var(--white);
      font-family: 'Outfit', Arial, sans-serif;
    }

    .admin-options-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--navy);
    }

    /* ── Partículas ── */
    .particles {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(55,147,208,0.15);
      animation: floatUp var(--d, 8s) ease-in-out infinite var(--delay, 0s);
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1);    opacity: 0; }
      20%  { opacity: 0.8; }
      80%  { opacity: 0.4; }
      100% { transform: translateY(-90px) scale(1.1); opacity: 0; }
    }

    /* ── Ondas ── */
    .waves {
      position: absolute;
      inset: auto 0 0 0;
      width: 100%;
      height: 52%;
      z-index: 1;
    }

    /* ── Top bar ── */
    .top-bar {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      width: min(520px, calc(100vw - 36px));
      margin: clamp(18px, 4vh, 30px) auto 0;
      animation: fadeDown 0.8s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand-small {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      grid-column: 2;
    }

    .admin-title {
      font-size: clamp(18px, 1.8vw, 24px);
      font-weight: 700;
      letter-spacing: -0.2px;
      text-align: center;
      color: var(--white);
    }

    .admin-role-tag {
      font-size: clamp(10px, 0.85vw, 12px);
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
    }

    .profile-button {
      grid-column: 3;
      display: flex;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      justify-self: end;
      border: 1px solid rgba(105,161,206,0.3);
      border-radius: 50%;
      background: rgba(55,147,208,0.12);
      color: var(--white);
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .profile-button:hover {
      background: rgba(55,147,208,0.28);
      border-color: rgba(105,161,206,0.6);
    }
    .profile-icon {
      width: 20px;
      height: 20px;
      fill: rgba(255,255,255,0.85);
    }

    /* ── Divisor ── */
    .divider {
      position: relative;
      z-index: 2;
      width: min(520px, calc(100vw - 36px));
      height: 1px;
      margin: clamp(10px, 2vh, 16px) auto 0;
      border: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    }

    /* ── Menú de opciones ── */
    .options-menu {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(16px, 3.2vh, 24px);
      margin-top: clamp(32px, 6.5vh, 48px);
      animation: fadeUp 0.85s 0.2s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .option-button {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: clamp(260px, 24vw, 340px);
      min-height: clamp(54px, 5.5vw, 66px);
      padding: 0 22px;
      border: 1px solid rgba(105,161,206,0.3);
      border-radius: 14px;
      background: rgba(43,127,188,0.18);
      color: var(--white);
      font-family: 'Outfit', Arial, sans-serif;
      font-size: clamp(15px, 1.35vw, 19px);
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 0.22s, border-color 0.22s, transform 0.18s;
      overflow: hidden;
    }

    /* brillo hover */
    .option-button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 50%, rgba(255,255,255,0.08) 0%, transparent 65%);
      opacity: 0;
      transition: opacity 0.22s;
      border-radius: inherit;
    }
    .option-button:hover::before { opacity: 1; }

    .option-button:hover {
      background: rgba(57,150,211,0.35);
      border-color: rgba(255,255,255,0.38);
      transform: translateX(5px);
    }
    .option-button:active {
      transform: translateX(2px);
    }

    /* Flecha derecha */
    .option-button::after {
      content: "";
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 7px;
      height: 7px;
      border-top: 1.5px solid rgba(255,255,255,0.4);
      border-right: 1.5px solid rgba(255,255,255,0.4);
      rotate: 45deg;
      transition: right 0.18s, border-color 0.18s;
    }
    .option-button:hover::after {
      right: 14px;
      border-color: rgba(255,255,255,0.75);
    }

    /* Iconos SVG */
    .opt-icon {
      width: 22px;
      height: 22px;
      stroke: rgba(255,255,255,0.75);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    @media (max-width: 520px) {
      .waves { height: 56%; }
      .option-button {
        width: min(290px, 84vw);
        font-size: clamp(14px, 4.5vw, 18px);
      }
      .options-menu { gap: 14px; margin-top: 5vh; }
    }
  </style>
</head>
<body>
  <main class="admin-options-screen" aria-label="Opciones de administrador">

    <!-- Partículas -->
    <div class="particles" id="particles" aria-hidden="true"></div>

    <!-- Ondas -->
    <svg class="waves" viewBox="0 0 1366 420" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#184f89"
        d="M0 76 C154 101 293 126 453 115 C625 104 748 46 899 70
           C1035 91 1134 97 1366 82 L1366 420 L0 420 Z"/>
      <path fill="#237fb9"
        d="M0 190 C181 178 372 170 509 196 C670 227 785 262 977 254
           C1137 247 1245 225 1366 204 L1366 420 L0 420 Z"/>
      <path fill="#69a1ce"
        d="M0 318 C170 293 324 284 491 302 C679 321 768 372 956 374
           C1115 376 1231 350 1366 322 L1366 420 L0 420 Z"/>
    </svg>

    <!-- Top bar -->
    <header class="top-bar">
      <div class="brand-small">
        <h1 class="admin-title">Administrador</h1>
        <span class="admin-role-tag">Panel de control</span>
      </div>
      <a class="profile-button" href="adminprofile.html" aria-label="Perfil del administrador">
        <svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12c2.35 0 4.25-1.9 4.25-4.25S14.35 3.5 12 3.5s-4.25 1.9-4.25 4.25S9.65 12 12 12Zm0 2c-3.95 0-7.5 2.02-7.5 4.25V20h15v-1.75C19.5 16.02 15.95 14 12 14Z"/>
        </svg>
      </a>
    </header>

    <hr class="divider">

    <!-- Menú -->
    <nav class="options-menu" aria-label="Menú de administrador">

      <a class="option-button" href="admincompanies.html">
        <svg class="opt-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18M9 3v18"/>
        </svg>
        Gestionar empresas
      </a>

      <a class="option-button" href="adminusers.html">
        <svg class="opt-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="7" r="3"/>
          <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          <path d="M21 20c0-3.3-1.8-6-5-6"/>
        </svg>
        Gestionar usuarios
      </a>

      <a class="option-button" href="exportlists.html">
        <svg class="opt-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v13M7 11l5 5 5-5"/>
          <path d="M4 20h16"/>
        </svg>
        Exportar listas
      </a>

    </nav>
  </main>

  <script>
    const pc = document.getElementById('particles');
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 5 + Math.random() * 16;
      p.style.cssText = `
        left:${Math.random()*100}%;
        bottom:${Math.random()*48}%;
        width:${size}px; height:${size}px;
        --d:${6+Math.random()*8}s;
        --delay:-${Math.random()*8}s;
      `;
      pc.appendChild(p);
    }
  </script>
</body>
</html>
