<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMap - Exportar Listas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #111649;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .export-screen {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      overflow: hidden;
      background: #111649;
      padding-bottom: 34px;
    }

    .waves {
      position: absolute;
      inset: auto 0 0 0;
      width: 100%;
      height: 52%;
    }

    .waves path {
      shape-rendering: geometricPrecision;
    }

    .top-bar {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      width: min(582px, calc(100vw - 44px));
      margin: 20px auto 0;
    }

    .home-link,
    .profile-link {
      display: flex;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: #ffffff;
      text-decoration: none;
    }

    .profile-link {
      justify-self: end;
    }

    .home-link:hover,
    .profile-link:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .top-icon {
      width: 30px;
      height: 30px;
      fill: currentColor;
    }

    .page-title {
      font-size: clamp(19px, 2.1vw, 23px);
      font-weight: 400;
      line-height: 1.2;
      text-align: center;
    }

    .divider {
      position: relative;
      z-index: 2;
      width: min(582px, calc(100vw - 44px));
      height: 2px;
      margin: 17px auto 0;
      border: 0;
      background: rgba(255, 255, 255, 0.82);
    }

    .export-options {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 235px));
      justify-content: center;
      gap: clamp(24px, 4.8vw, 30px);
      width: min(560px, calc(100vw - 48px));
      margin: 40px auto 0;
    }

    .export-card {
      display: flex;
      min-height: 194px;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      border: 1px solid rgba(106, 174, 226, 0.35);
      border-radius: 11px;
      background: rgba(42, 125, 188, 0.58);
      color: #ffffff;
      padding: 24px 18px 7px;
      text-decoration: none;
    }

    .export-card:hover {
      background: rgba(55, 145, 207, 0.68);
    }

    .card-icon {
      display: flex;
      width: 68px;
      height: 68px;
      align-items: center;
      justify-content: center;
      margin-bottom: 13px;
      color: #ffffff;
    }

    .card-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .card-title {
      min-height: 25px;
      color: #ffffff;
      font-size: clamp(18px, 2.1vw, 21px);
      font-weight: 400;
      line-height: 1.15;
      text-align: center;
    }

    .arrow-button {
      display: flex;
      width: 106px;
      height: 43px;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
      border-radius: 8px;
      background: rgba(58, 153, 216, 0.82);
      color: #ffffff;
    }

    .arrow-button svg {
      width: 37px;
      height: 37px;
      fill: currentColor;
    }

    @media (max-width: 620px) {
      body {
        overflow-y: auto;
      }

      .export-screen {
        overflow-y: auto;
      }

      .top-bar {
        margin-top: 14px;
      }

      .waves {
        height: 58%;
      }

      .export-options {
        grid-template-columns: minmax(0, 260px);
        margin-top: 28px;
      }

      .export-card {
        min-height: 180px;
      }
    }
  </style>
</head>
<body>
  <main class="export-screen" aria-label="Exportar listas">
    <svg class="waves" viewBox="0 0 1366 420" preserveAspectRatio="none" aria-hidden="true">
      <path
        fill="#184f89"
        d="M0 76 C154 101 293 126 453 115 C625 104 748 46 899 70 C1035 91 1134 97 1366 82 L1366 420 L0 420 Z"
      />
      <path
        fill="#237fb9"
        d="M0 190 C181 178 372 170 509 196 C670 227 785 262 977 254 C1137 247 1245 225 1366 204 L1366 420 L0 420 Z"
      />
      <path
        fill="#69a1ce"
        d="M0 318 C170 293 324 284 491 302 C679 321 768 372 956 374 C1115 376 1231 350 1366 322 L1366 420 L0 420 Z"
      />
    </svg>

    <header class="top-bar">
      <a class="home-link" href="adminhome.html" aria-label="Volver al inicio de administrador">
        <svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.1 7.3H4.7l3.8-3.8L7.1 2.1.9 8.3l6.2 6.2 1.4-1.4-3.8-3.8h3.4c4.2 0 7.6 3.4 7.6 7.6V20h2v-3.1c0-5.3-4.3-9.6-9.6-9.6Z"/>
        </svg>
      </a>

      <h1 class="page-title">Exportar listas</h1>

      <a class="profile-link" href="adminprofile.html" aria-label="Perfil del administrador">
        <svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12c2.35 0 4.25-1.9 4.25-4.25S14.35 3.5 12 3.5s-4.25 1.9-4.25 4.25S9.65 12 12 12Zm0 2c-3.95 0-7.5 2.02-7.5 4.25V20h15v-1.75C19.5 16.02 15.95 14 12 14Z"/>
        </svg>
      </a>
    </header>

    <hr class="divider">

    <section class="export-options" aria-label="Opciones de exportaci&oacute;n">
      <a class="export-card" href="exportuserbd.html" aria-label="Exportar listas de usuarios">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 2.8a9.2 9.2 0 1 0 0 18.4 9.2 9.2 0 0 0 0-18.4Zm0 2a7.2 7.2 0 0 1 4.96 12.42c-.54-1.34-2.76-2.38-4.96-2.38s-4.42 1.04-4.96 2.38A7.2 7.2 0 0 1 12 4.8Zm0 8.2c1.65 0 2.98-1.34 2.98-2.98S13.65 7.04 12 7.04s-2.98 1.34-2.98 2.98S10.35 13 12 13Z"/>
          </svg>
        </span>
        <span class="card-title">Listas de usuarios</span>
        <span class="arrow-button" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19Zm0 2a7.5 7.5 0 1 1 0 15 7.5 7.5 0 0 1 0-15Zm1.6 3.55-1.42 1.41L13.73 11H7.5v2h6.23l-1.55 1.54 1.42 1.41L17.55 12 13.6 8.05Z"/>
          </svg>
        </span>
      </a>

      <a class="export-card" href="exportcompanybd.html" aria-label="Exportar base de datos de empresa">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5.5 4h13A1.5 1.5 0 0 1 20 5.5V9H4V5.5A1.5 1.5 0 0 1 5.5 4Zm-1.5 7h16v4H4v-4Zm0 6h16v1.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5V17Z"/>
          </svg>
        </span>
        <span class="card-title">BD de empresa</span>
        <span class="arrow-button" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19Zm0 2a7.5 7.5 0 1 1 0 15 7.5 7.5 0 0 1 0-15Zm1.6 3.55-1.42 1.41L13.73 11H7.5v2h6.23l-1.55 1.54 1.42 1.41L17.55 12 13.6 8.05Z"/>
          </svg>
        </span>
      </a>
    </section>
  </main>
</body>
</html>
