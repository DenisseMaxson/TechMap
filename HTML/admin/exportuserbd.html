<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMap - BD de Usuarios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy:  #111649;
      --blue1: #184f89;
      --blue2: #237fb9;
      --blue3: #3793d0;
      --sky:   #69a1ce;
      --white: #ffffff;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: var(--navy);
      color: var(--white);
      font-family: 'Outfit', Arial, sans-serif;
    }

    .user-export-screen {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      overflow: hidden;
      background: var(--navy);
      padding-bottom: 36px;
    }

    /* ── Partículas ── */
    .particles {
      position: absolute; inset: 0; z-index: 0;
      overflow: hidden; pointer-events: none;
    }
    .particle {
      position: absolute; border-radius: 50%;
      background: rgba(55,147,208,0.15);
      animation: floatUp var(--d,8s) ease-in-out infinite var(--delay,0s);
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1);       opacity: 0; }
      20%  { opacity: 0.8; }
      80%  { opacity: 0.4; }
      100% { transform: translateY(-90px) scale(1.1); opacity: 0; }
    }

    /* ── Ondas ── */
    .waves {
      position: absolute; inset: auto 0 0 0;
      width: 100%; height: 52%; z-index: 1;
    }

    /* ── Top bar ── */
    .top-bar {
      position: relative; z-index: 2;
      display: grid; grid-template-columns: 44px 1fr 44px;
      align-items: center;
      width: min(620px, calc(100vw - 44px));
      margin: 20px auto 0;
      animation: fadeDown 0.75s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .back-link, .profile-link {
      display: flex; width: 38px; height: 38px;
      align-items: center; justify-content: center;
      border: 1px solid rgba(105,161,206,0.25);
      border-radius: 10px;
      background: rgba(55,147,208,0.1);
      color: var(--white); text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .profile-link { justify-self: end; }
    .back-link:hover, .profile-link:hover {
      background: rgba(55,147,208,0.25);
      border-color: rgba(105,161,206,0.5);
    }
    .top-icon { width: 22px; height: 22px; fill: rgba(255,255,255,0.85); }

    .title-wrap { text-align: center; }
    .page-title {
      font-size: clamp(17px, 1.8vw, 22px);
      font-weight: 700; letter-spacing: -0.2px;
    }
    .page-sub {
      font-size: clamp(10px, 0.85vw, 12px); font-weight: 300;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(255,255,255,0.35); margin-top: 3px;
    }

    /* ── Divisor ── */
    .divider {
      position: relative; z-index: 2;
      width: min(620px, calc(100vw - 44px));
      height: 1px; margin: 10px auto 0; border: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
    }

    /* ── Grid de empresas ── */
    .company-grid {
      position: relative; z-index: 2;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 260px));
      justify-content: center;
      gap: 16px 20px;
      width: min(580px, calc(100vw - 48px));
      margin: 26px auto 0;
      animation: fadeUp 0.8s 0.2s cubic-bezier(.22,1,.36,1) both;
    }

    /* ── Card de empresa ── */
    .company-card {
      position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      min-height: 130px;
      border: 1px solid rgba(105,161,206,0.28);
      border-radius: 16px;
      background: rgba(42,125,188,0.14);
      color: var(--white);
      padding: 18px 16px 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      transition: background 0.22s, border-color 0.22s, transform 0.18s;
    }
    /* línea superior acento */
    .company-card::before {
      content: "";
      position: absolute; top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--blue2), var(--sky));
      border-radius: 16px 16px 0 0;
      opacity: 0; transition: opacity 0.22s;
    }
    .company-card:hover {
      background: rgba(55,145,207,0.25);
      border-color: rgba(105,161,206,0.5);
      transform: translateY(-2px);
    }
    .company-card:hover::before { opacity: 1; }

    .empty-message {
      grid-column: 1 / -1;
      color: rgba(255,255,255,0.45);
      font-size: 13px; font-weight: 300;
      text-align: center; padding: 24px 0;
    }

    /* Icono empresa dentro de la card */
    .card-icon-wrap {
      display: flex; width: 40px; height: 40px;
      align-items: center; justify-content: center;
      border-radius: 10px;
      background: rgba(55,147,208,0.2);
      border: 1px solid rgba(105,161,206,0.3);
      margin-bottom: 10px;
      transition: transform 0.2s;
    }
    .company-card:hover .card-icon-wrap { transform: scale(1.06); }
    .card-icon-wrap svg {
      width: 20px; height: 20px;
      stroke: rgba(255,255,255,0.8); fill: none;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
    }

    .company-name {
      font-size: clamp(13px, 1.3vw, 15px);
      font-weight: 600; color: var(--white);
      text-align: center; line-height: 1.3;
      margin-bottom: 14px;
    }

    /* ── Botón exportar ── */
    .export-button {
      display: flex; align-items: center;
      justify-content: center; gap: 7px;
      width: 100%; min-height: 34px;
      border: 1px solid rgba(105,161,206,0.35);
      border-radius: 9px;
      background: rgba(35,127,185,0.3);
      color: var(--white);
      font-family: 'Outfit', Arial, sans-serif;
      font-size: clamp(12px, 1vw, 13px);
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    .export-button svg {
      width: 14px; height: 14px;
      stroke: rgba(255,255,255,0.8); fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .export-button:hover {
      background: rgba(55,147,208,0.5);
      border-color: rgba(255,255,255,0.38);
      transform: translateY(-1px);
    }
    .export-button:active { transform: translateY(0); }

    /* Loading state */
    .export-button.loading {
      opacity: 0.6; pointer-events: none;
    }

    @media (max-width: 620px) {
      body { overflow-y: auto; }
      .user-export-screen { overflow-y: auto; }
      .top-bar { margin-top: 14px; }
      .waves { height: 58%; }
      .company-grid {
        grid-template-columns: minmax(0, 280px);
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="user-export-screen" aria-label="Exportar listas de usuarios por empresa">

    <!-- Partículas -->
    <div class="particles" id="particles" aria-hidden="true"></div>

    <!-- Ondas -->
    <svg class="waves" viewBox="0 0 1366 420" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#184f89"
        d="M0 76 C154 101 293 126 453 115 C625 104 748 46 899 70
           C1035 91 1134 97 1366 82 L1366 420 L0 420 Z"/>
      <path fill="#237fb9"
        d="M0 190 C181 178 372 170 509 196 C670 227 785 262 977 254
           C1137 247 1245 225 1366 204 L1366 420 L0 420 Z"/>
      <path fill="#69a1ce"
        d="M0 318 C170 293 324 284 491 302 C679 321 768 372 956 374
           C1115 376 1231 350 1366 322 L1366 420 L0 420 Z"/>
    </svg>

    <!-- Top bar -->
    <header class="top-bar">
      <a class="back-link" href="exportlists.html" aria-label="Volver a exportar listas">
        <svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9.7 5.3 3 12l6.7 6.7 1.4-1.4L6.8 13H21v-2H6.8l4.3-4.3-1.4-1.4Z"/>
        </svg>
      </a>
      <div class="title-wrap">
        <h1 class="page-title">Listas de usuarios</h1>
        <p class="page-sub">Exportar por empresa</p>
      </div>
      <a class="profile-link" href="adminprofile.html" aria-label="Perfil del administrador">
        <svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12c2.35 0 4.25-1.9 4.25-4.25S14.35 3.5 12 3.5s-4.25 1.9-4.25 4.25S9.65 12 12 12Zm0 2c-3.95 0-7.5 2.02-7.5 4.25V20h15v-1.75C19.5 16.02 15.95 14 12 14Z"/>
        </svg>
      </a>
    </header>

    <hr class="divider">

    <!-- Grid de empresas -->
    <section class="company-grid" id="companyGrid"
             aria-label="Empresas disponibles para exportar usuarios">
    </section>

  </main>

  <script>
    // Partículas
    const pc = document.getElementById('particles');
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 5 + Math.random() * 16;
      p.style.cssText = `
        left:${Math.random()*100}%;
        bottom:${Math.random()*48}%;
        width:${size}px; height:${size}px;
        --d:${6+Math.random()*8}s;
        --delay:-${Math.random()*8}s;
      `;
      pc.appendChild(p);
    }

    // API
    const COMPANIES_API = 'http://localhost:3000/api/empresas';
    const USERS_API     = 'http://localhost:3000/api/usuarios';
    const companyGrid   = document.getElementById('companyGrid');

    const escapeHtml = (v) => String(v ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[c]));

    const companyIcon = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 9h18M9 3v18"/>
      </svg>`;

    const downloadFile = async (url, filename) => {
      const response = await fetch(url);
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.error || 'No se pudo exportar el archivo');
      }
      const blob = await response.blob();
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
    };

    const renderCompanies = (companies) => {
      companyGrid.innerHTML = '';
      if (!companies.length) {
        companyGrid.innerHTML = '<p class="empty-message">No hay empresas para exportar.</p>';
        return;
      }
      companies.forEach((company) => {
        const card = document.createElement('article');
        card.className = 'company-card';
        card.innerHTML = `
          <div class="card-icon-wrap">${companyIcon}</div>
          <h2 class="company-name">${escapeHtml(company.nombre || 'Empresa sin nombre')}</h2>
          <button class="export-button" type="button"
                  data-company-id="${company.id}" data-export-type="users">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v13M7 11l5 5 5-5"/>
              <path d="M4 20h16"/>
            </svg>
            Exportar usuarios
          </button>`;

        card.querySelector('.export-button').addEventListener('click', async (e) => {
          const btn = e.currentTarget;
          btn.classList.add('loading');
          btn.textContent = 'Exportando...';
          try {
            await downloadFile(
              `${USERS_API}/empresa/${company.id}/export`,
              `usuarios_empresa_${company.id}.csv`
            );
          } catch (error) {
            alert(error.message);
          } finally {
            btn.classList.remove('loading');
            btn.innerHTML = `
              <svg viewBox="0 0 24 24" aria-hidden="true"
                   style="width:14px;height:14px;stroke:rgba(255,255,255,0.8);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round">
                <path d="M12 3v13M7 11l5 5 5-5"/><path d="M4 20h16"/>
              </svg>
              Exportar usuarios`;
          }
        });

        companyGrid.appendChild(card);
      });
    };

    const loadCompanies = async () => {
      companyGrid.innerHTML = '<p class="empty-message">Cargando empresas...</p>';
      try {
        const response = await fetch(COMPANIES_API);
        if (!response.ok) throw new Error('No se pudieron cargar las empresas');
        renderCompanies(await response.json());
      } catch (error) {
        companyGrid.innerHTML = `<p class="empty-message">${error.message}</p>`;
      }
    };

    loadCompanies();
  </script>
</body>
</html>
