<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy:   #111649;
      --blue1:  #1380bd;
      --blue2:  #244594;
      --blue3:  #3793d0;
      --sky:    #69a1ce;
      --white:  #ffffff;
    }

    body {
      min-height: 100vh;
      background: var(--navy);
      color: var(--white);
      font-family: 'Outfit', Arial, sans-serif;
      overflow: hidden;
    }

    /* ── Pantalla principal ── */
    .main-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #1a3a7a 0%, #1380bd 55%, #69a1ce 100%);
    }

    /* ── Estrellas de fondo ── */
    .stars {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255,255,255,0.55);
      border-radius: 50%;
      animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.4); }
    }

    /* ── Montañas SVG ── */
    .mountains {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ── Relleno inferior ── */
    .foreground-fill {
      position: absolute;
      left: 0; right: 0; bottom: -1px;
      height: 38%;
      background: var(--navy);
      z-index: 2;
    }

    /* ── Línea de brillo en el horizonte ── */
    .horizon-glow {
      position: absolute;
      left: 0; right: 0;
      bottom: 37.5%;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(55,147,208,0.6) 30%, rgba(105,161,206,0.9) 50%, rgba(55,147,208,0.6) 70%, transparent 100%);
      z-index: 3;
      filter: blur(1px);
    }

    /* ── Marca / Logo ── */
    .brand {
      position: absolute;
      z-index: 4;
      top: 0; left: 0; right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20vh;
      animation: fadeDown 0.9s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-mark {
      position: relative;
      width: clamp(190px, 24vw, 320px);
      margin-bottom: 16px;
      filter: drop-shadow(0 0 18px rgba(55,147,208,0.45));
    }

    .logo-mark img {
      width: 100%;
      height: auto;
      display: block;
    }

    .brand-tagline {
      margin-top: 18px;
      font-size: clamp(12px, 1.2vw, 16px);
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }

    /* ── Botón ── */
    .login-button {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 14vh;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 clamp(28px, 3vw, 44px);
      height: clamp(44px, 5.5vw, 62px);
      background: rgba(55,147,208,0.18);
      border: 1.5px solid rgba(105,161,206,0.55);
      border-radius: 14px;
      color: var(--white);
      font-family: 'Outfit', Arial, sans-serif;
      font-size: clamp(16px, 1.8vw, 22px);
      font-weight: 500;
      letter-spacing: 0.02em;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.25s, border-color 0.25s, transform 0.18s;
      animation: fadeUp 0.9s 0.3s cubic-bezier(.22,1,.36,1) both;
      white-space: nowrap;
    }
    .login-button svg {
      width: 20px; height: 20px;
      stroke: rgba(255,255,255,0.75);
      flex-shrink: 0;
      transition: transform 0.22s;
    }
    .login-button:hover {
      background: rgba(55,147,208,0.35);
      border-color: rgba(255,255,255,0.55);
      transform: translateX(-50%) translateY(-2px);
    }
    .login-button:hover svg {
      transform: translateX(4px);
    }
    .login-button:active {
      transform: translateX(-50%) translateY(0);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ── Versión ── */
    .version-badge {
      position: absolute;
      z-index: 4;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.28);
      text-transform: uppercase;
      animation: fadeUp 0.9s 0.5s cubic-bezier(.22,1,.36,1) both;
    }

    @media (max-width: 520px) {
      .brand { padding-top: 18vh; }
      .login-button { bottom: 16vh; }
    }
  </style>
</head>
<body>

  <main class="main-screen" aria-label="Pantalla principal de TechMap">

    <!-- Estrellas generadas dinámicamente -->
    <div class="stars" id="stars" aria-hidden="true"></div>

    <!-- Montañas -->
    <svg class="mountains" viewBox="0 0 1366 768" preserveAspectRatio="none" aria-hidden="true">
      <!-- Capa lejana: azul medio -->
      <path
        fill="#1d518b"
        d="M0 280 C80 180 160 120 270 128 C390 137 480 188 610 168 C748 148 820 108 928 84
           C1032 60 1100 112 1160 188 C1240 288 1310 318 1366 280 L1366 768 L0 768 Z"
      />
      <!-- Capa media: azul translúcido -->
      <path
        fill="#2a5c8f"
        opacity="0.85"
        d="M0 255 C90 160 170 96 285 118 C415 142 505 175 635 155
           C765 134 818 112 930 70 C1045 26 1140 108 1198 198
           C1265 308 1320 342 1366 318 L1366 768 L0 768 Z"
      />
      <!-- Capa frontal: navy -->
      <path
        fill="#111649"
        d="M0 348 C95 304 148 318 232 330 C330 344 418 402 514 378
           C616 352 668 298 776 332 C866 360 938 404 1010 440
           C1120 496 1258 524 1366 548 L1366 768 L0 768 Z"
      />
    </svg>

    <!-- Brillo horizonte -->
    <div class="horizon-glow" aria-hidden="true"></div>

    <!-- Relleno navy -->
    <div class="foreground-fill" aria-hidden="true"></div>

    <!-- Marca -->
    <section class="brand" aria-label="TechMap logo y nombre">
      <div class="logo-mark">
        <img src="../../TechMapLogo.png" alt="TechMap">
      </div>
      <p class="brand-tagline">Gestión de inventario de hardware</p>
    </section>

    <!-- Botón -->
    <a class="login-button" href="login.html" aria-label="Ir a iniciar sesión">
      Iniciar sesión
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    </a>

    <!-- Versión -->
    <span class="version-badge" aria-hidden="true">v1.0 &mdash; León Servicios Computacionales</span>

  </main>

  <script>
    // Genera estrellas aleatorias
    const container = document.getElementById('stars');
    for (let i = 0; i < 55; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.cssText = `
        left:${Math.random()*100}%;
        top:${Math.random()*62}%;
        --d:${2.5 + Math.random()*3}s;
        --delay:-${Math.random()*4}s;
        width:${Math.random() < 0.25 ? 3 : 2}px;
        height:${Math.random() < 0.25 ? 3 : 2}px;
        opacity:${0.3 + Math.random()*0.5};
      `;
      container.appendChild(s);
    }
  </script>
</body>
</html>
